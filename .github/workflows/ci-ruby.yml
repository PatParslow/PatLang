name: CI Ruby (manual)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install deps
        run: |
          bundle install --without development
      - name: Run tests
        run: |
          bundle exec rake -T || true
          if [ -f Rakefile ]; then bundle exec rake || true; fi
