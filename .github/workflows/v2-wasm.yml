# v2 through WebAssembly on Linux (review, test-suite recommendation 1): the
# compiler built from bootstrap/v2_compiler.ir by bootstrap/ir_wasm.py, then
# used under Node to build and run the demos (tools/ci_wasm.sh). The full gates
# need Windows and hours; this needs neither. The networking and bakery demos
# use sockets, which the browser's host has none of, and are skipped.
name: v2 through WebAssembly

on: [push, pull_request]

jobs:
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the compiler as WebAssembly and run the demos with it
        run: bash tools/ci_wasm.sh 06_networking_and_signals 07_bakery_all_paradigms
