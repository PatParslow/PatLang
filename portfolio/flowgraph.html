<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>PatLang flow graphs</title>
<style>
:root { color-scheme: light dark; }
body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
h1 { font-size: 1.4rem; }
button, input { font: inherit; padding: 0.3rem 0.7rem; }
ul { padding-left: 1.2rem; }
.card { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 8px; padding: 1rem; margin: 1rem 0; }
pre { overflow-x: auto; background: color-mix(in srgb, currentColor 8%, transparent); border-radius: 6px; padding: 0.6rem; font-size: 0.85rem; }
pre.src { max-height: 22rem; }
pre.out { min-height: 1.5rem; }
.label { margin-bottom: 0.2rem; opacity: 0.75; font-size: 0.9rem; }
.ms { opacity: 0.75; font-size: 0.9rem; }
summary { cursor: pointer; }
</style>
</head>
<body>
<h1>PatLang control-flow graphs</h1>
<p>Basic blocks and jump edges recovered from the self-hosted compiler's IR for <code>self_hosting/examples/fib_bench.patlang</code>. Red curves are conditional (JumpIfFalse), blue are unconditional.</p>
<style>svg text { font: 12px monospace; fill: currentColor; } svg .bh { font-weight: bold; }</style>
<h3>fib</h3>
<svg viewBox='0 0 560 602' width='560' height='602' xmlns='http://www.w3.org/2000/svg'>
<path d='M 330 122 C 520 122, 520 254, 335 254' fill='none' stroke='#d64' marker-end='url(#arr)'/>
<path d='M 330 226 C 520 226, 520 540, 335 540' fill='none' stroke='#48c' marker-end='url(#arr)'/>
<defs><marker id='arr' viewBox='0 0 8 8' refX='7' refY='4' markerWidth='6' markerHeight='6' orient='auto'><path d='M 0 0 L 8 4 L 0 8 z' fill='#888'/></marker></defs>
<text x='16' y='26' class='bh'>B@0</text>
<text x='28' y='50'>Load n</text>
<text x='28' y='76'>Const num 2</text>
<text x='28' y='102'>Bin &lt;</text>
<text x='28' y='128'>JumpIfFalse 7</text>
<text x='16' y='156' class='bh'>B@4</text>
<text x='28' y='180'>Load n</text>
<text x='28' y='206'>Return</text>
<text x='28' y='232'>Jump 17</text>
<text x='16' y='260' class='bh'>B@7</text>
<text x='28' y='284'>Load n</text>
<text x='28' y='310'>Const num 1</text>
<text x='28' y='336'>Bin -</text>
<text x='28' y='362'>Call fib 1</text>
<text x='28' y='388'>Load n</text>
<text x='28' y='414'>Const num 2</text>
<text x='28' y='440'>Bin -</text>
<text x='28' y='466'>Call fib 1</text>
<text x='28' y='492'>Bin +</text>
<text x='28' y='518'>Return</text>
<text x='16' y='546' class='bh'>B@17</text>
<text x='28' y='570'>Return</text>
</svg>
<h3>sum_to</h3>
<svg viewBox='0 0 560 654' width='560' height='654' xmlns='http://www.w3.org/2000/svg'>
<path d='M 330 252 C 520 252, 520 540, 335 540' fill='none' stroke='#d64' marker-end='url(#arr)'/>
<path d='M 330 512 C 520 512, 520 150, 335 150' fill='none' stroke='#48c' marker-end='url(#arr)'/>
<defs><marker id='arr' viewBox='0 0 8 8' refX='7' refY='4' markerWidth='6' markerHeight='6' orient='auto'><path d='M 0 0 L 8 4 L 0 8 z' fill='#888'/></marker></defs>
<text x='16' y='26' class='bh'>B@0</text>
<text x='28' y='50'>Const num 0</text>
<text x='28' y='76'>Store total</text>
<text x='28' y='102'>Const num 1</text>
<text x='28' y='128'>Store i</text>
<text x='16' y='156' class='bh'>B@4</text>
<text x='28' y='180'>Load i</text>
<text x='28' y='206'>Load n</text>
<text x='28' y='232'>Bin &lt;=</text>
<text x='28' y='258'>JumpIfFalse 17</text>
<text x='16' y='286' class='bh'>B@8</text>
<text x='28' y='310'>Load total</text>
<text x='28' y='336'>Load i</text>
<text x='28' y='362'>Bin +</text>
<text x='28' y='388'>Store total</text>
<text x='28' y='414'>Load i</text>
<text x='28' y='440'>Const num 1</text>
<text x='28' y='466'>Bin +</text>
<text x='28' y='492'>Store i</text>
<text x='28' y='518'>Jump 4</text>
<text x='16' y='546' class='bh'>B@17</text>
<text x='28' y='570'>Load total</text>
<text x='28' y='596'>Return</text>
<text x='28' y='622'>Return</text>
</svg>
<h3>main</h3>
<svg viewBox='0 0 560 2266' width='560' height='2266' xmlns='http://www.w3.org/2000/svg'>
<path d='M 330 1292 C 520 1292, 520 1606, 335 1606' fill='none' stroke='#d64' marker-end='url(#arr)'/>
<path d='M 330 1578 C 520 1578, 520 1190, 335 1190' fill='none' stroke='#48c' marker-end='url(#arr)'/>
<defs><marker id='arr' viewBox='0 0 8 8' refX='7' refY='4' markerWidth='6' markerHeight='6' orient='auto'><path d='M 0 0 L 8 4 L 0 8 z' fill='#888'/></marker></defs>
<text x='16' y='26' class='bh'>B@0</text>
<text x='28' y='50'>CallHost now_ms 0</text>
<text x='28' y='76'>Store t0</text>
<text x='28' y='102'>Const num 27</text>
<text x='28' y='128'>Call fib 1</text>
<text x='28' y='154'>Store f</text>
<text x='28' y='180'>CallHost now_ms 0</text>
<text x='28' y='206'>Store t1</text>
<text x='28' y='232'>Const str fib(27) = </text>
<text x='28' y='258'>Load f</text>
<text x='28' y='284'>Bin +</text>
<text x='28' y='310'>Const str   [</text>
<text x='28' y='336'>Bin +</text>
<text x='28' y='362'>Load t1</text>
<text x='28' y='388'>Load t0</text>
<text x='28' y='414'>Bin -</text>
<text x='28' y='440'>Bin +</text>
<text x='28' y='466'>Const str  ms]</text>
<text x='28' y='492'>Bin +</text>
<text x='28' y='518'>CallHost print 1</text>
<text x='28' y='544'>CallHost now_ms 0</text>
<text x='28' y='570'>Store t2</text>
<text x='28' y='596'>Const num 2000000</text>
<text x='28' y='622'>Call sum_to 1</text>
<text x='28' y='648'>Store s</text>
<text x='28' y='674'>CallHost now_ms 0</text>
<text x='28' y='700'>Store t3</text>
<text x='28' y='726'>Const str sum 1..2000000 = </text>
<text x='28' y='752'>Load s</text>
<text x='28' y='778'>Bin +</text>
<text x='28' y='804'>Const str   [</text>
<text x='28' y='830'>Bin +</text>
<text x='28' y='856'>Load t3</text>
<text x='28' y='882'>Load t2</text>
<text x='28' y='908'>Bin -</text>
<text x='28' y='934'>Bin +</text>
<text x='28' y='960'>Const str  ms]</text>
<text x='28' y='986'>Bin +</text>
<text x='28' y='1012'>CallHost print 1</text>
<text x='28' y='1038'>CallHost now_ms 0</text>
<text x='28' y='1064'>Store t4</text>
<text x='28' y='1090'>CallHost vec_new 0</text>
<text x='28' y='1116'>Store xs</text>
<text x='28' y='1142'>Const num 0</text>
<text x='28' y='1168'>Store k</text>
<text x='16' y='1196' class='bh'>B@44</text>
<text x='28' y='1220'>Load k</text>
<text x='28' y='1246'>Const num 200000</text>
<text x='28' y='1272'>Bin &lt;</text>
<text x='28' y='1298'>JumpIfFalse 58</text>
<text x='16' y='1326' class='bh'>B@48</text>
<text x='28' y='1350'>Load xs</text>
<text x='28' y='1376'>Load k</text>
<text x='28' y='1402'>Const num 2</text>
<text x='28' y='1428'>Bin *</text>
<text x='28' y='1454'>CallHost vec_push 2</text>
<text x='28' y='1480'>Load k</text>
<text x='28' y='1506'>Const num 1</text>
<text x='28' y='1532'>Bin +</text>
<text x='28' y='1558'>Store k</text>
<text x='28' y='1584'>Jump 44</text>
<text x='16' y='1612' class='bh'>B@58</text>
<text x='28' y='1636'>CallHost now_ms 0</text>
<text x='28' y='1662'>Store t5</text>
<text x='28' y='1688'>Const str built vector of </text>
<text x='28' y='1714'>Load xs</text>
<text x='28' y='1740'>CallHost vec_len 1</text>
<text x='28' y='1766'>Bin +</text>
<text x='28' y='1792'>Const str   [</text>
<text x='28' y='1818'>Bin +</text>
<text x='28' y='1844'>Load t5</text>
<text x='28' y='1870'>Load t4</text>
<text x='28' y='1896'>Bin -</text>
<text x='28' y='1922'>Bin +</text>
<text x='28' y='1948'>Const str  ms]</text>
<text x='28' y='1974'>Bin +</text>
<text x='28' y='2000'>CallHost print 1</text>
<text x='28' y='2026'>Const str total: </text>
<text x='28' y='2052'>Load t5</text>
<text x='28' y='2078'>Load t0</text>
<text x='28' y='2104'>Bin -</text>
<text x='28' y='2130'>Bin +</text>
<text x='28' y='2156'>Const str  ms</text>
<text x='28' y='2182'>Bin +</text>
<text x='28' y='2208'>CallHost print 1</text>
<text x='28' y='2234'>Return</text>
</svg>
