_queue: \u0026'a MessageQueue,\r\n    pub error_handler: \u0026'a dyn ErrorHandler,\r\n    pub secure_distributed_code_support: \u0026'a SecureDistributedCodeSupport,\r\n    // Internal state (placeholder for actual allocator)\r\n    allocations: Vec\u003cMemoryHandle\u003e,\r\n}\r\n\r\nimpl\u003c'a\u003e MemoryManager\u003c'a\u003e {\r\n    /// Create a new Memory Manager with integration points.\r\n    pub fn new(\r\n        core_evaluator: \u0026'a CoreEvaluator,\r\n        event_system: \u0026'a EventSystem,\r\n        message_queue: \u0026'a MessageQueue,\r\n        error_handler: \u0026'a dyn ErrorHandler,\r\n        secure_distributed_code_support: \u0026'a SecureDistributedCodeSupport,\r\n    ) -\u003e Self {\r\n        Self {\r\n            core_evaluator,\r\n            event_system,\r\n            message_queue,\r\n            error_handler,\r\n            secure_distributed_code_support,\r\n            allocations: Vec::new(),\r\n        }\r\n    }\r\n\r\n    /// Allocate a block of memory. Returns a handle or error.\r\n    pub fn allocate(\u0026mut self, size: usize) -\u003e Result\u003cMemoryHandle, MemoryManagerError\u003e {\r\n        // Basic logic: simulate allocation by pushing to allocations vector.\r\n        let handle = MemoryHandle {\r\n            ptr: self.allocations.len() + 1, // Simulated pointer\r\n            size,\r\n        };\r\n        self.allocations.push(handle.clone());\r\n        // Integration: notify event system (stub)\r\n        // self.event_system.notify_allocation(\u0026handle);\r\n        Ok(handle)\r\n    }\r\n\r\n    /// Deallocate a block of memory by handle.\r\n    pub fn deallocate(\u0026mut self, handle: \u0026MemoryHandle) -\u003e Result\u003c(), MemoryManagerError\u003e {\r\n        // Basic logic: remove from allocations vector.\r\n        if let Some(pos) = self.allocations.iter().position(|h| h.ptr == handle.ptr) {\r\n            self.allocations.remove(pos);\r\n            // Integration: notify event syste e_queue.rs"],"content":"//! Message Queue Module\r\n//!\r\n//! Responsibilities:\r\n//! - Provides async, decoupled messaging between core runtime modules.\r\n//! - Supports distributed coordination and reliable delivery (extensible).\r\n//! - Integrates with CoreEvaluator, MemoryManager, GoalSystem, TypeSystem, InferencingEngine, ScopeManager, ObjectModel, ErrorHandler, EventSystem, SecureDistributedCodeSupport.\r\n//!\r\n//! Extensibility Points:\r\n//! - Pluggable backends for distributed and reliable delivery.\r\n//! - Custom message types and serialization strategies.\r\n//! - Hooks for monitoring, tracing, and security policies.\r\n\r\nuse std::collections::VecDeque;\r\nuse std::sync::{Arc, Mutex};\r\nuse tokio::sync::mpsc;\r\n\r\n/// Represents a message to be sent through the queue.\r\n/// Extendable for typed, structured, or secure messages.\r\n#[derive(Debug, Clone)]\r\npub struct Message {\r\n    pub sender: String,\r\n    pub recipient: String,\r\n    pub payload: Vec\u003cu8\u003e,\r\n    // Add fields for message type, priority, etc.\r\n}\r\n/// Trait for types that consume messages from the queue.\r\n///\r\n/// Implementors define how to handle incoming messages.\r\npub trait MessageConsumer {\r\n    /// Called when a new message is received.\r\n    fn on_message(\u0026self, message: \u0026Message);\r\n}\r\n\r\n/// Public API for the Message Queue.\r\n#[derive(Clone)]\r\npub struct MessageQueue {\r\n    inner: Arc\u003cMutex\u003cVecDeque\u003cMessage\u003e\u003e\u003e,\r\n    // For async integration, a channel is also provided.\r\n    tx: mpsc::Sender\u003cMessage\u003e,\r\n}\r\n\r\nimpl MessageQueue {\r\n    /// Create a new MessageQueue instance.\r\n    pub fn new(buffer: usize) -\u003e (Self, mpsc::Receiver\u003cMessage\u003e) {\r\n        let (tx, rx) = mpsc::channel(buffer);\r\n        (\r\n            MessageQueue {\r\n                inner: Arc::new(Mutex::new(VecDeque::new())),\r\n                tx,\r\n            },\r\n            rx,\r\n        )\r\n    }\r\n\r\n    /// Send a message asynchronously.\r\n    pub async fn send(\u0026self, msg: Message) -\u003e Result\u003c(), String\u003e {\r\n        // Enqueue for local queue (basic logic).\r\n        {\r\n            let mut queue = self.inner.lock().unwrap();\r\n            queue.push_back(msg.clone());\r\n        }\r\n        // Also send via async channel for consumers.\r\n        self.tx.send(msg).await.map_err(|e| e.to_string())\r\n    }\r\n\r\n    /// Receive a message synchronously (basic, non-blocking).\r\n    pub fn try_receive(\u0026self) -\u003e Option\u003cMessage\u003e {\r\n        let mut queue = self.inner.lock().unwrap();\r\n        queue.pop_front()\r\n    }\r\n\r\n    /// Get current queue length.\r\n    pub fn len(\u0026self) -\u003e usize {\r\n        let queue = self.inner.lock().unwrap();\r\n        queue.len()\r\n    }\r\n\r\n    /// Check if the queue is empty.\r\n    pub fn is_empty(\u0026self) -\u003e bool {\r\n        self.len() == 0\r\n    }\r\n}\r\n\r\n// --- Integration Stubs ---\r\n// These stubs represent integration points with core modules.\r\n// Actual integration logic should be implemented in each module as needed.\r\n\r\n/// Integration with CoreEvaluator.\r\npub mod core_evaluator_integration {\r\n    use super::*;\r\n    pub fn register_with_core_evaluator(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}\r\n\r\n/// Integration with MemoryManager.\r\npub mod memory_manager_integration {\r\n    use super::*;\r\n    pub fn register_with_memory_manager(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}\r\n\r\n/// Integration with GoalSystem.\r\npub mod goal_system_integration {\r\n    use super::*;\r\n    pub fn register_with_goal_system(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}\r\n\r\n/// Integration with TypeSystem.\r\npub mod type_system_integration {\r\n    use super::*;\r\n    pub fn register_with_type_system(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}\r\n\r\n/// Integration with InferencingEngine.\r\npub mod inferencing_engine_integration {\r\n    use super::*;\r\n    pub fn register_with_inferencing_engine(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}\r\n\r\n/// Integration with ScopeManager.\r\npub mod scope_manager_integration {\r\n    use super::*;\r\n    pub fn register_with_scope_manager(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}\r\n\r\n/// Integration with ObjectModel.\r\npub mod object_model_integration {\r\n    use super::*;\r\n    pub fn register_with_object_model(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}\r\n\r\n/// Integration with ErrorHandler.\r\npub mod error_handler_integration {\r\n    use super::*;\r\n    pub fn register_with_error_handler(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}\r\n\r\n/// Integration with EventSystem.\r\npub mod event_system_integration {\r\n    use super::*;\r\n    pub fn register_with_event_system(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}\r\n\r\n/// Integration with SecureDistributedCodeSupport.\r\npub mod secure_distributed_code_support_integration {\r\n    use super::*;\r\n    pub fn register_with_secure_distributed_code_support(_mq: \u0026MessageQueue) {\r\n        // Register hooks or handlers as needed.\r\n    }\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","src","object.rs"],"content":"//! Object Module Stub\r\n//! Handles object creation and manipulation for the evaluator.\r\n\r\n#[derive(Debug, Clone)]\r\npub struct Object {\r\n    pub class_name: String,\r\n    // Add fields for properties, methods, etc.\r\n}\r\n\r\nimpl Object {\r\n    pub fn new(class_name: \u0026str) -\u003e Self {\r\n        Object {\r\n            class_name: class_name.to_string(),\r\n            // Initialize properties\r\n        }\r\n    }\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","src","object_model.rs"],"content":"//! Object Model Module\r\n//! \r\n//! Responsibilities:\r\n//! - Defines core object structure, property/method storage, and basic behavior.\r\n//! - Provides public API for object creation, property access, and method dispatch.\r\n//! - Extensible for inheritance, dynamic dispatch, and integration with type/memory systems.\r\n//! - Integrates with Core Evaluator, Memory Manager, Goal System, Type System, Inferencing Engine, Scope Manager, Event System, Message Queue, Error Handler, and Secure Distributed Code Support.\r\n//!\r\n//! Extensibility Points:\r\n//! - Custom object types via trait implementations.\r\n//! - Future support for inheritance, dynamic dispatch, and distributed object features.\r\n\r\nuse std::collections::HashMap;\r\nuse std::sync::{Arc, Mutex};\r\n\r\n/// Represents a method callable on an object.\r\npub type Method = fn(\u0026mut Object, Vec\u003cValue\u003e) -\u003e Result\u003cValue, ObjectError\u003e;\r\n\r\n/// Represents a value in the runtime (stub for integration with type/memory system).\r\n#[derive(Clone, Debug)]\r\npub enum Value {\r\n    Int(i64),\r\n    Float(f64),\r\n    Str(String),\r\n    Bool(bool),\r\n    Object(Arc\u003cMutex\u003cObject\u003e\u003e),\r\n    // Extend with more types as needed.\r\n    // ...\r\n}\r\n\r\n/// Error type for object operations (stub for integration with error handler).\r\n#[derive(Debug)]\r\npub struct ObjectError {\r\n    pub message: String,\r\n}\r\n\r\n/// Core object structure.\r\n#[derive(Debug)]\r\npub struct Object {\r\n    pub class_name: String,\r\n    pub properties: HashMap\u003cString, Value\u003e,\r\n    pub methods: HashMap\u003cString, Method\u003e,\r\n    // Future: parent/inheritance, type info, memory integration, etc.\r\n}\r\n\r\nimpl Object {\r\n    /// Creates a new object with the given class name.\r\n    pub fn new(class_name: \u0026str) -\u003e Self {\r\n        Object {\r\n            class_name: class_name.to_string(),\r\n            properties: HashMap::new(),\r\n            methods: HashMap::new(),\r\n        }\r\n    }\r\n\r\n    /// Sets a property value.\r\n    pub fn set_property(\u0026mut self, key: \u0026str, value: Value) {\r\n        self.properties.insert(key.to_string(), value);\r\n    }\r\n\r\n    /// Gets a property value.\r\n    pub fn get_property(\u0026self, key: \u0026str) -\u003e Option\u003c\u0026Value\u003e {\r\n        self.properties.get(key)\r\n    }\r\n\r\n    /// Registers a method.\r\n    pub fn add_method(\u0026mut self, name: \u0026str, method: Method) {\r\n        self.methods.insert(name.to_string(), method);\r\n    }\r\n\r\n    /// Calls a method by name.\r\n    pub fn call_method(\u0026mut self, name: \u0026str, args: Vec\u003cValue\u003e) -\u003e Result\u003cValue, ObjectError\u003e {\r\n        if let Some(method) = self.methods.get(name) {\r\n            method(self, args)\r\n        } else {\r\n            Err(ObjectError {\r\n                message: format!(\"Method '{}' not found on '{}'\", name, self.class_name),\r\n            })\r\n        }\r\n    }\r\n}\r\n\r\n// --- Integration Stubs ---\r\n\r\n/// Integration with Core Evaluator.\r\npub trait EvaluatorIntegration {\r\n    fn eval_object(\u0026self, obj: \u0026Object) -\u003e Result\u003cValue, ObjectError\u003e;\r\n}\r\n\r\n/// Integration with Memory Manager.\r\npub trait MemoryManagerIntegration {\r\n    fn allocate_object(\u0026self, obj: Object) -\u003e Arc\u003cMutex\u003cObject\u003e\u003e;\r\n}\r\n\r\n/// Integration with Goal System.\r\npub trait GoalSystemIntegration {\r\n    fn register_object_goal(\u0026self, obj: \u0026Object);\r\n}\r\n\r\n/// Integration with Type System.\r\npub trait TypeSystemIntegration {\r\n    fn get_object_type(\u0026self, obj: \u0026Object) -\u003e String;\r\n}\r\n\r\n/// Integration with Inferencing Engine.\r\npub trait InferencingEngineIntegration {\r\n    fn infer_object_properties(\u0026self, obj: \u0026Object);\r\n}\r\n\r\n/// Integration with Scope Manager.\r\npub trait ScopeManagerIntegration {\r\n    fn bind_object(\u0026self, name: \u0026str, obj: Arc\u003cMutex\u003cObject\u003e\u003e);\r\n}\r\n\r\n/// Integration with Event System.\r\npub trait EventSystemIntegration {\r\n    fn emit_object_event(\u0026self, obj: \u0026Object, event: \u0026str);\r\n}\r\n\r\n/// Integration with Message Queue.\r\npub trait MessageQueueIntegration {\r\n    fn queue_object_message(\u0026self, obj: \u0026Object, message: \u0026str);\r\n}\r\n\r\n/// Integration with Error Handler.\r\npub trait ErrorHandlerIntegration {\r\n    fn handle_object_error(\u0026self, error: \u0026ObjectError);\r\n}\r\n\r\n/// Integration with Secure Distributed Code Support.\r\npub trait SecureDistributedCodeIntegration {\r\n    fn authorize_object_action(\u0026self, obj: \u0026Object, action: \u0026str) -\u003e bool;\r\n}\r\n\r\n// --- Example Usage (for future tests) ---\r\n// let mut obj = Object::new(\"Example\");\r\n// obj.set_property(\"x\", Value::Int(42));\r\n// obj.add_method(\"get_x\", |o, _| o.get_property(\"x\").cloned().ok_or(ObjectError{message: \"No x\".into()}));","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","src","parser.rs"],"content":"/// Patlang Parser for Rust\r\n\r\nuse crate::lexer::{Lexer, Token, LexerError};\r\nuse crate::ast;\r\n\r\nuse ast::{Expr, Stmt};\r\n\r\n#[derive(Debug)]\r\npub enum ParserError {\r\n    UnexpectedToken(Token),\r\n    UnexpectedEOF,\r\n    LexerError(LexerError),\r\n    // Extend with more error types as needed\r\n}\r\n\r\npub struct Parser\u003c'a\u003e {\r\n    lexer: Lexer\u003c'a\u003e,\r\n    current_token: Token,\r\n}\r\n\r\nimpl\u003c'a\u003e Parser\u003c'a\u003e {\r\n    pub fn new(input: \u0026'a str) -\u003e Result\u003cSelf, ParserError\u003e {\r\n        let mut lexer = Lexer::new(input);\r\n        let first_token = lexer.next_token().map_err(ParserError::LexerError)?;\r\n        Ok(Parser { lexer, current_token: first_token })\r\n    }\r\n\r\n    pub fn parse(\u0026mut self) -\u003e Result\u003cVec\u003cStmt\u003e, ParserError\u003e {\r\n        let mut statements = Vec::new();\r\n        let mut statement_count = 0;\r\n        loop {\r\n            println!(\"[DEBUG][parse] Top of loop: current_token = {:?}\", self.current_token);\r\n            // Skip all newlines before a statement\r\n            while self.current_token == Token::Newline {\r\n                println!(\"[DEBUG][parse] Skipping newline before statement\");\r\n                self.advance()?;\r\n            }\r\n            // If we hit EOF after skipping newlines, we're done\r\n            if self.current_token == Token::EOF {\r\n                println!(\"[DEBUG][parse] Hit EOF after skipping newlines, breaking\");\r\n                break;\r\n            }\r\n            // If the next token is not a valid statement start, break\r\n            match self.current_token {\r\n                Token::Identifier(_) | Token::Number(_) | Token::String(_) | Token::LParen =\u003e {},\r\n                Token::EOF =\u003e {\r\n                    println!(\"[DEBUG][parse] Hit EOF, breaking\");\r\n                    break;\r\n                },\r\n                ref t =\u003e {\r\n                    println!(\"[DEBUG][parse] Unexpected token at statement start: {:?}\", t);\r\n                    break;\r\n                }\r\n            }\r\n            let stmt = self.parse_statement()?;\r\n            statement_count += 1;\r\n            println!(\"[DEBUG][parse] Parsed statement #{}: {:?}\", statement_count, stmt);\r\n            statements.push(stmt);\r\n            // Skip all newlines after a statement\r\n            while self.current_token == Token::Newline {\r\n                println!(\"[DEBUG][parse] Skipping newline after statement\");\r\n                self.advance()?;\r\n            }\r\n            // If we hit EOF after skipping newlines, we're done\r\n            if self.current_token == Token::EOF {\r\n                println!(\"[DEBUG][parse] Hit EOF after statement, breaking\");\r\n                break;\r\n            }\r\n        }\r\n        println!(\"[DEBUG][parse] Finished parsing. Total statements: {}\", statement_count);\r\n        Ok(statements)\r\n    }\r\n\r\n    fn parse_statement(\u0026mut self) -\u003e Result\u003cStmt, ParserError\u003e {\r\n        // Dispatch to subparsers based on current_token\r\n        match \u0026self.current_token {\r\n            Token::Goal =\u003e self.parse_goal_block(),\r\n            Token::Rule =\u003e self.parse_rule_block(),\r\n            _ =\u003e self.parse_expression_statement(),\r\n        }\r\n    }\r\n    \r\n    // Stub implementations for goal/rule blocks\r\n    fn parse_goal_block(\u0026mut self) -\u003e Result\u003cStmt, ParserError\u003e {\r\n        // For now, just consume the 'goal' token and the next identifier, then skip to next newline or EOF\r\n        self.advance()?; // consume 'goal'\r\n        let name = if let Token::Identifier(ref s) = self.current_token {\r\n            s.clone()\r\n        } else {\r\n            return Err(ParserError::UnexpectedToken(self.current_token.clone()));\r\n        };\r\n        self.advance()?; // consume identifier\r\n        // Optionally parse parameters, block, etc.\r\n        // For now, skip to next newline or EOF\r\n        while self.current_token != Token::EOF \u0026\u0026 self.current_token != Token::Newline {\r\n            self.advance()?;\r\n        }\r\n        Ok(Stmt::ExprStmt(Expr::Identifier(format!(\"goal:{}\", name))))\r\n    }\r\n    \r\n    fn parse_rule_block(\u0026mut self) -\u003e Result\u003cStmt, ParserError\u003e {\r\n        // For now, just consume the 'rule' token and the next identifier, then skip to next newline or EOF\r\n        self.advance()?; // consume 'rule'\r\n        let name = if let Token::Identifier(ref s) = self.current_token {\r\n            s.clone()\r\n        } else {\r\n            return Err(ParserError::UnexpectedToken(self.current_token.clone()));\r\n        };\r\n        self.advance()?; // consume identifier\r\n        // Optionally parse parameters, block, etc.\r\n        // For now, skip to next newline or EOF\r\n        while self.current_token != Token::EOF \u0026\u0026 self.current_token != Token::Newline {\r\n            self.advance()?;\r\n        }\r\n        Ok(Stmt::ExprStmt(Expr::Identifier(format!(\"rule:{}\", name))))\r\n    }\r\n\r\n    fn parse_expression_statement(\u0026mut self) -\u003e Result\u003cStmt, ParserError\u003e {\r\n        let expr = self.parse_expression()?;\r\n        // Only advance if not at EOF or Newline (avoid advancing past end)\r\n        if self.current_token != Token::EOF \u0026\u0026 self.current_token != Token::Newline {\r\n            self.advance()?;\r\n        }\r\n        Ok(Stmt::ExprStmt(expr))\r\n    }\r\n\r\n    fn parse_expression(\u0026mut self) -\u003e Result\u003cExpr, ParserError\u003e {\r\n        self.parse_binary_expression(0)\r\n    }\r\n\r\n    // Operator precedence: * / \u003e + -\r\n    fn get_precedence(token: \u0026Token) -\u003e u8 {\r\n        match token {\r\n            Token::Star | Token::Slash | Token::Percent =\u003e 4,\r\n            Token::Plus | Token::Minus =\u003e 3,\r\n            Token::Greater | Token::GreaterEqual | Token::Less | Token::LessEqual =\u003e 2,\r\n            Token::Identifier(id) if id == \"and\" =\u003e 1,\r\n            Token::Identifier(id) if id == \"or\" =\u003e 1,\r\n            _ =\u003e 0,\r\n        }\r\n    }\r\n\r\n    fn parse_binary_expression(\u0026mut self, min_prec: u8) -\u003e Result\u003cExpr, ParserError\u003e {\r\n        let mut left = self.parse_primary()?;\r\n\r\n        println!(\r\n            \"[DEBUG][parse_binary_expression] Start: min_prec = {}, left = {:?}, current_token = {:?}\",\r\n            min_prec, left, self.current_token\r\n        );\r\n\r\n        loop {\r\n            let prec = Self::get_precedence(\u0026self.current_token);\r\n            println!(\r\n                \"[DEBUG][parse_binary_expression] Loop: min_prec = {}, token = {:?}, prec = {}\",\r\n                min_prec, self.current_token, prec\r\n            );\r\n            if prec \u003c min_prec || prec == 0 {\r\n                println!(\r\n                    \"[DEBUG][parse_binary_expression] Breaking: prec \u003c min_prec or prec == 0 (prec = {}, min_prec = {})\",\r\n                    prec, min_prec\r\n                );\r\n                break;\r\n            }\r\n\r\n            let op_token = self.current_token.clone();\r\n            self.advance()?;\r\n\r\n            println!(\r\n                \"[DEBUG][parse_binary_expression] Parsing right side: op_token = {:?}, next_token = {:?}, next_prec = {}\",\r\n                op_token, self.current_token, Self::get_precedence(\u0026self.current_token)\r\n            );\r\n\r\n            let mut right = self.parse_binary_expression(prec + 1)?;\r\n\r\n            println!(\r\n                \"[DEBUG][parse_binary_expression] Building BinaryOp: left = {:?}, op_token = {:?}, right = {:?}\",\r\n                left, op_token, right\r\n            );\r\n\r\n            let op = match op_token {\r\n                Token::Plus =\u003e ast::BinaryOperator::Add,\r\n                Token::Minus =\u003e ast::BinaryOperator::Sub,\r\n                Token::Star =\u003e ast::BinaryOperator::Mul,\r\n                Token::Slash =\u003e ast::BinaryOperator::Div,\r\n                Token::Percent =\u003e ast::BinaryOperator::Mod,\r\n                Token::Greater =\u003e ast::BinaryOperator::Greater,\r\n                Token::GreaterEqual =\u003e ast::BinaryOperator::GreaterEqual,\r\n                Token::Less =\u003e ast::BinaryOperator::Less,\r\n                Token::LessEqual =\u003e ast::BinaryOperator::LessEqual,\r\n                Token::Identifier(id) if id == \"and\" =\u003e ast::BinaryOperator::And,\r\n                Token::Identifier(id) if id == \"or\" =\u003e ast::BinaryOperator::Or,\r\n                _ =\u003e return Err(ParserError::UnexpectedToken(op_token)),\r\n            };\r\n\r\n            left = Expr::BinaryOp {\r\n                left: Box::new(left),\r\n                op,\r\n                right: Box::new(right),\r\n            };\r\n            println!(\r\n                \"[DEBUG][parse_binary_expression] Updated left: {:?}\",\r\n                left\r\n            );\r\n        }\r\n\r\n        println!(\r\n            \"[DEBUG][parse_binary_expression] Returning: {:?}\",\r\n            left\r\n        );\r\n        Ok(left)\r\n    }\r\n\r\n    fn parse_primary(\u0026mut self) -\u003e Result\u003cExpr, ParserError\u003e {\r\n        let token = self.current_token.clone();\r\n        match token {\r\n            Token::Number(n) =\u003e {\r\n                let expr = Expr::Number(n);\r\n                self.advance()?;\r\n                Ok(expr)\r\n            }\r\n            Token::String(s) =\u003e {\r\n                let expr = Expr::String(s);\r\n                self.advance()?;\r\n                Ok(expr)\r\n            }\r\n            Token::Identifier(ref id) if id == \"not\" =\u003e {\r\n                self.advance()?;\r\n                let expr = self.parse_primary()?;\r\n                Ok(Expr::UnaryOp {\r\n                    op: \"not\".to_string(),\r\n                    expr: Box::new(expr),\r\n                })\r\n            }\r\n            Token::Identifier(ref id) =\u003e {\r\n                // Treat \"true\" and \"false\" as boolean literals, else identifier or function call\r\n                let ident_expr = match id.as_str() {\r\n                    \"true\" =\u003e Expr::Identifier(\"true\".to_string()),\r\n                    \"false\" =\u003e Expr::Identifier(\"false\".to_string()),\r\n                    _ =\u003e Expr::Identifier(id.clone()),\r\n                };\r\n                self.advance()?;\r\n                // Check for function call: identifier followed by '('\r\n                if self.current_token == Token::LParen {\r\n                    self.advance()?;\r\n                    let mut args = Vec::new();\r\n                    if self.current_token != Token::RParen {\r\n                        loop {\r\n                            // Parse a full expression as an argument!\r\n                            let arg = self.parse_expression()?;\r\n                            args.push(arg);\r\n                            if self.current_token == Token::Comma {\r\n                                self.advance()?;\r\n                            } else {\r\n                                break;\r\n                            }\r\n                        }\r\n                    }\r\n                    if self.current_token != Token::RParen {\r\n                        return Err(ParserError::UnexpectedToken(self.current_token.clone()));\r\n                    }\r\n                    self.advance()?;\r\n                    println!(\"[DEBUG] Parsed function call: {}({:?})\", id, args);\r\n                    Ok(Expr::Call {\r\n                        function: Box::new(ident_expr),\r\n                        args,\r\n                    })\r\n                } else {\r\n                    Ok(ident_expr)\r\n                }\r\n            }\r\n            Token::LParen =\u003e {\r\n                println!(\"[DEBUG][parse_primary] Found LParen, entering parenthesized expression\");\r\n                self.advance()?;\r\n                let expr = self.parse_expression()?;\r\n                println!(\"[DEBUG][parse_primary] Parsed inner expr: {:?}\", expr);\r\n                if self.current_token != Token::RParen {\r\n                    println!(\r\n                        \"[DEBUG][parse_primary] Expected RParen, found {:?}\",\r\n                        self.current_token\r\n                    );\r\n                    return Err(ParserError::UnexpectedToken(self.current_token.clone()));\r\n                }\r\n                self.advance()?;\r\n                println!(\"[DEBUG][parse_primary] Closed parenthesized expression, returning {:?}\", expr);\r\n                Ok(expr)\r\n            }\r\n            _ =\u003e Err(ParserError::UnexpectedToken(self.current_token.clone())),\r\n        }\r\n    }\r\n\r\n    fn advance(\u0026mut self) -\u003e Result\u003c(), ParserError\u003e {\r\n        self.current_token = self.lexer.next_token().map_err(ParserError::LexerError)?;\r\n        Ok(())\r\n    }\r\n\r\n    // Add more subparsers for functions, let, etc.\r\n}\r\n\r\n/// Conversion from parser AST to evaluator AST\r\n\r\nuse crate::core_evaluator::{AstNode, AstKind};\r\n\r\nimpl From\u003cast::Expr\u003e for AstNode {\r\n    fn from(expr: ast::Expr) -\u003e Self {\r\n        match expr {\r\n            ast::Expr::Number(n) =\u003e AstNode { kind: AstKind::Number(n), children: vec![] },\r\n            ast::Expr::String(s) =\u003e AstNode { kind: AstKind::String(s), children: vec![] },\r\n            ast::Expr::Identifier(id) =\u003e AstNode { kind: AstKind::Identifier(id), children: vec![] },\r\n            ast::Expr::UnaryOp { op, expr } =\u003e {\r\n                // For now, just wrap the unary op as a string node for debugging\r\n                AstNode {\r\n                    kind: AstKind::Identifier(format!(\"unary:{}({:?})\", op, expr)),\r\n                    children: vec![],\r\n                }\r\n            }\r\n            ast::Expr::BinaryOp { left, op, right } =\u003e AstNode {\r\n                kind: AstKind::BinaryOp {\r\n                    op: crate::ast::BinaryOpKind::from_operator(\u0026op),\r\n                    left: Box::new(AstNode::from(*left)),\r\n                    right: Box::new(AstNode::from(*right)),\r\n                },\r\n ributed scope sync, advanced memory policies.\r\n\r\nuse std::collections::HashMap;\r\n\r\n/// Represents a single variable binding in a scope.\r\n#[derive(Debug, Clone)]\r\npub struct VariableBinding {\r\n    pub name: String,\r\n    pub value: ScopeValue,\r\n}\r\n\r\n/// Value type for variables (placeholder for integration with type/memory systems).\r\n#[derive(Debug, Clone, PartialEq)]\r\npub enum ScopeValue {\r\n    Int(i64),\r\n    Float(f64),\r\n    Str(String),\r\n    Bool(bool),\r\n    // Extend with more types or references as needed.\r\n    // For integration: Box\u003cdyn Any\u003e or custom Value type.\r\n}\r\n\r\n/// Represents a scope (symbol table).\r\n#[derive(Debug, Clone)]\r\npub struct Scope {\r\n    variables: HashMap\u003cString, ScopeValue\u003e,\r\n    parent: Option\u003cBox\u003cScope\u003e\u003e,\r\n}\r\n\r\nimpl Scope {\r\n    /// Create a new root scope.\r\n    pub fn new() -\u003e Self {\r\n        Scope {\r\n            variables: HashMap::new(),\r\n            parent: None,\r\n        }\r\n    }\r\n\r\n    /// Create a new child scope.\r\n    pub fn child(\u0026self) -\u003e Self {\r\n        Scope {\r\n            variables: HashMap::new(),\r\n            parent: Some(Box::new(self.clone())),\r\n        }\r\n    }\r\n\r\n    /// Bind a variable in the current scope.\r\n    pub fn bind(\u0026mut self, name: \u0026str, value: ScopeValue) {\r\n        self.variables.insert(name.to_string(), value);\r\n    }\r\n\r\n    /// Lookup a variable, searching parent scopes if necessary.\r\n    pub fn lookup(\u0026self, name: \u0026str) -\u003e Option\u003c\u0026ScopeValue\u003e {\r\n        match self.variables.get(name) {\r\n            Some(val) =\u003e Some(val),\r\n            None =\u003e match \u0026self.parent {\r\n                Some(parent) =\u003e parent.lookup(name),\r\n                None =\u003e None,\r\n            },\r\n        }\r\n    }\r\n}\r\n\r\n/// Public API for Scope Manager.\r\npub struct ScopeManager {\r\n    current_scope: Scope,\r\n    // Integration stubs for other modules:\r\n    // evaluator: Option\u003cArc\u003cCoreEvaluator\u003e\u003e,\r\n    // memory_manager: Option\u003cArc\u003cMemoryManager\u003e\u003e,\r\n    // goal_system: Option\u003cArc\u003cGoalSystem\u003e\u003e,\r\n    // type_system: Option\u003cArc\u003cTypeSystem\u003e\u003e,\r\n    // inferencing_engine: Option\u003cArc\u003cInferencingEngine\u003e\u003e,\r\n    // event_system: Option\u003cArc\u003cEventSystem\u003e\u003e,\r\n    // message_queue: Option\u003cArc\u003cMessageQueue\u003e\u003e,\r\n    // error_handler: Option\u003cArc\u003cErrorHandler\u003e\u003e,\r\n    // secure_code_support: Option\u003cArc\u003cSecureDistributedCodeSupport\u003e\u003e,\r\n}\r\n\r\nimpl ScopeManager {\r\n    /// Initialize a new Scope Manager with a root scope.\r\n    pub fn new() -\u003e Self {\r\n        ScopeManager {\r\n            current_scope: Scope::new(),\r\n        }\r\n    }\r\n\r\n    /// Enter a new child scope.\r\n    pub fn enter_scope(\u0026mut self) {\r\n        let child = self.current_scope.child();\r\n        self.current_scope = child;\r\n    }\r\n\r\n    /// Exit to parent scope (if any).\r\n    pub fn exit_scope(\u0026mut self) {\r\n        if let Some(parent) = self.current_scope.parent.take() {\r\n            self.current_scope = *parent;\r\n        }\r\n        // else: already at root, do nothing.\r\n    }\r\n\r\n    /// Bind a variable in the current scope.\r\n    pub fn bind_variable(\u0026mut self, name: \u0026str, value: ScopeValue) {\r\n        self.current_scope.bind(name, value);\r\n    }\r\n\r\n    /// Lookup a variable, searching up the scope chain.\r\n    pub fn lookup_variable(\u0026self, name: \u0026str) -\u003e Option\u003c\u0026ScopeValue\u003e {\r\n        self.current_scope.lookup(name)\r\n    }\r\n\r\n    // --- Integration stubs for other modules ---\r\n\r\n    /// Integrate with Core Evaluator.\r\n    pub fn set_core_evaluator(\u0026mut self /*, evaluator: Arc\u003cCoreEvaluator\u003e */) {\r\n        // Integration logic here.\r\n    }\r\n\r\n    /// Integrate with Memory Manager.\r\n    pub fn set_memory_manager(\u0026mut self /*, memory_manager: Arc\u003cMemoryManager\u003e */) {\r\n        // Integration logic here.\r\n    }\r\n\r\n    /// Integrate with Goal System.\r\n    pub fn set_goal_system(\u0026mut self /*, goal_system: Arc\u003cGoalSystem\u003e */) {\r\n        // Integration logic here.\r\n    }\r\n\r\n    /// Integrate with Type System.\r\n    pub fn set_type_system(\u0026mut self /*, type_system: Arc\u003cTypeSystem\u003e */) {\r\n        // Integration logic here.\r\n    }\r\n\r\n    /// Integrate with Inferencing Engine.\r\n    pub fn set_inferencing_engine(\u0026mut self /*, inferencing_engine: Arc\u003cInferencingEngine\u003e */) {\r\n        // Integration logic here.\r\n    }\r\n\r\n    /// Integrate with Event System.\r\n    pub fn set_event_system(\u0026mut self /*, event_system: Arc\u003cEventSystem\u003e */) {\r\n        // Integration logic here.\r\n    }\r\n\r\n    /// Integrate with Message Queue.\r\n    pub fn set_message_queue(\u0026mut self /*, message_queue: Arc\u003cMessageQueue\u003e */) {\r\n        // Integration logic here.\r\n    }\r\n\r\n    /// Integrate with Error Handler.\r\n    pub fn set_error_handler(\u0026mut self /*, error_handler: Arc\u003cErrorHandler\u003e */) {\r\n        // Integration logic here.\r\n    }\r\n\r\n    /// Integrate with Secure Distributed Code Support.\r\n    pub fn set_secure_code_support(\u0026mut self /*, secure_code_support: Arc\u003cSecureDistributedCodeSupport\u003e */) {\r\n        // Integration logic here.\r\n    }\r\n}\r\n\r\n// --- Tests (optional, can be moved to a separate file) ---\r\n#[cfg(test)]\r\nmod tests {\r\n    use super::*;\r\n\r\n    #[test]\r\n    fn test_scope_bind_and_lookup() {\r\n        let mut scope = Scope::new();\r\n        scope.bind(\"x\", ScopeValue::Int(42));\r\n        assert_eq!(scope.lookup(\"x\"), Some(\u0026ScopeValue::Int( tributedCodeSupport {\r\n    // Add methods or trait implementations as needed.\r\n}\r\n\r\n// =========================\r\n// === Extension Traits ====\r\n// =========================\r\n\r\n/// Trait for custom security policies (authentication \u0026 authorization).\r\npub trait SecurityPolicy: Send + Sync {\r\n    /// Authenticate a node with credentials.\r\n    fn authenticate(\u0026self, node_id: \u0026str, credentials: \u0026[u8]) -\u003e Result\u003cbool, crate::error_handler::RuntimeError\u003e;\r\n    /// Authorize an action for a subject.\r\n    fn authorize(\u0026self, subject: \u0026str, action: \u0026str, resource: \u0026str) -\u003e Result\u003cbool, crate::error_handler::RuntimeError\u003e;\r\n}\r\n\r\n/// Trait for custom distributed protocol integration.\r\npub trait DistributedProtocol: Send + Sync {\r\n    /// Deploy code to nodes using a custom protocol.\r\n    fn deploy(\u0026self, code_package: \u0026[u8], target_nodes: \u0026[String]) -\u003e Result\u003c(), crate::error_handler::RuntimeError\u003e;\r\n    /// Execute code remotely using a custom protocol.\r\n    fn execute(\u0026self, node_id: \u0026str, payload: \u0026[u8]) -\u003e Result\u003cVec\u003cu8\u003e, crate::error_handler::RuntimeError\u003e;\r\n}\r\n\r\n/// Trait for custom sandbox models.\r\n/// Now dyn-compatible (object-safe).\r\npub trait SandboxModel: Send + Sync {\r\n    // Add object-safe methods here as needed.\r\n}\r\n\r\n// =========================\r\n// === Core Functions    ===\r\n// =========================\r\n\r\n/// Deploys code securely to the distributed system using a pluggable protocol.\r\n///\r\n/// # Extensibility\r\n/// - Pass a custom `DistributedProtocol` for protocol integration.\r\n/// - Use `SecurityPolicy` for pre-deployment validation.\r\npub fn deploy_code(\r\n    code_package: \u0026[u8],\r\n    target_nodes: \u0026[String],\r\n    protocol: \u0026dyn DistributedProtocol,\r\n    security_policy: Option\u003c\u0026dyn SecurityPolicy\u003e,\r\n    custom_error_handler: Option\u003c\u0026dyn crate::error_handler::ErrorHandler\u003e,\r\n) -\u003e Result\u003c(), crate::error_handler::RuntimeError\u003e {\r\n    audit_log(\"deploy\", \"Code deployment initiated\");\r\n    let event = crate::event_system::Event {\r\n        event_type: \"deploy\".to_string(),\r\n        payload: format!(\"Deploying code to nodes: {:?}\", target_nodes),\r\n    };\r\n    on_event(\u0026event);\r\n\r\n    // Optional: Security policy validation\r\n    if let Some(policy) = security_policy {\r\n        for node in target_nodes {\r\n            let auth = policy.authenticate(node, b\"default\");\r\n            if let Err(e) = auth {\r\n                audit_log(\"error\", \u0026format!(\"Security policy error: {}\", e.message));\r\n                return Err(e);\r\n            }\r\n        }\r\n    }\r\n\r\n    // Use custom protocol for deployment\r\n    let result = protocol.deploy(code_package, target_nodes);\r\n    if let Err(ref error) = result {\r\n        audit_log(\"error\", \u0026format!(\"Deployment error: {}\", error.message));\r\n        let error_event = crate::event_system::Event {\r\n            event_type: \"error\".to_string(),\r\n            payload: format!(\"Deployment error: {}\", error.message),\r\n        };\r\n        on_event(\u0026error_event);\r\n        if let Some(handler) = custom_error_handler {\r\n            handler.handle(error);\r\n        }\r\n        crate::error_handler::report_error(error.clone());\r\n    }\r\n    result\r\n}\r\n\r\n/// Executes code remotely on a specified node using a pluggable protocol.\r\n///\r\n/// # Extensibility\r\n/// - Pass a custom `DistributedProtocol` for protocol integration.\r\n/// - Use `SecurityPolicy` for pre-execution authorization.\r\npub fn execute_remote(\r\n    node_id: \u0026str,\r\n    payload: \u0026[u8],\r\n    protocol: \u0026dyn DistributedProtocol,\r\n    security_policy: Option\u003c\u0026dyn SecurityPolicy\u003e,\r\n    custom_error_handler: Option\u003c\u0026dyn crate::error_handler::ErrorHandler\u003e,\r\n) -\u003e Result\u003cVec\u003cu8\u003e, crate::error_handler::RuntimeError\u003e {\r\n    audit_log(\"exec\", \u0026format!(\"Remote execution requested on node: {}\", node_id));\r\n    let event = crate::event_system::Event {\r\n        event_type: \"exec\".to_string(),\r\n        payload: format!(\"Executing payload on node: {}\", node_id),\r\n    };\r\n    on_event(\u0026event);\r\n\r\n    // Optional: Security policy authorization\r\n    if let Some(policy) = security_policy {\r\n        let authz = policy.authorize(node_id, \"execute\", \"payload\");\r\n        if let Err(e) = authz {\r\n            audit_log(\"error\", \u0026format!(\"Security policy error: {}\", e.message));\r\n            return Err(e);\r\n        }\r\n    }\r\n\r\n    // Use custom protocol for execution\r\n    let result = protocol.execute(node_id, payload);\r\n    if let Err(ref error) = result {\r\n        audit_log(\"error\", \u0026format!(\"Execution error: {}\", error.message));\r\n        let error_event = crate::event_system::Event {\r\n            event_type: \"error\".to_string(),\r\n            payload: format!(\"Execution error: {}\", error.message),\r\n        };\r\n        on_event(\u0026error_event);\r\n        if let Some(handler) = custom_error_handler {\r\n            handler.handle(error);\r\n        }\r\n        crate::error_handler::report_error(error.clone());\r\n    }\r\n    result\r\n}\r\n\r\n/// Authenticates a node using a pluggable security policy.\r\n///\r\n/// # Extensibility\r\n/// - Pass a custom `SecurityPolicy` for authentication logic.\r\npub fn authenticate_node(\r\n    node_id: \u0026str,\r\n    credentials: \u0026[u8],\r\n    security_policy: \u0026dyn SecurityPolicy,\r\n    custom_error_handler: Option\u003c\u0026dyn crate::error_handler::ErrorHandler\u003e,\r\n) -\u003e Result\u003cbool, crate::error_handler::RuntimeError\u003e {\r\n    audit_log(\"security\", \u0026format!(\"Authentication attempt for node: {}\", node_id));\r\n    let event = crate::event_system::Event {\r\n        event_type: \"security\".to_string(),\r\n        payload: format!(\"Authentication attempt for node: {}\", node_id),\r\n    };\r\n    on_event(\u0026event);\r\n\r\n    // Use security policy for authentication\r\n    let result = security_policy.authenticate(node_id, credentials);\r\n    if let Err(ref error) = result {\r\n        audit_log(\"error\", \u0026format!(\"Authentication error: {}\", error.message));\r\n        let error_event = crate::event_system::Event {\r\n            event_type: \"error\".to_string(),\r\n            payload: format!(\"Authentication error: {}\", error.message),\r\n        };\r\n        on_event(\u0026error_event);\r\n        if let Some(handler) = custom_error_handler {\r\n            handler.handle(error);\r\n        }\r\n        crate::error_handler::report_error(error.clone());\r\n    }\r\n    result\r\n}\r\n\r\n/// Authorizes an action using a pluggable security policy.\r\n///\r\n/// # Extensibility\r\n/// - Pass a custom `SecurityPolicy` for authorization logic.\r\npub fn authorize_action(\r\n    subject: \u0026str,\r\n    action: \u0026str,\r\n    resource: \u0026str,\r\n    security_policy: \u0026dyn SecurityPolicy,\r\n    custom_error_handler: Option\u003c\u0026dyn crate::error_handler::ErrorHandler\u003e,\r\n) -\u003e Result\u003cbool, crate::error_handler::RuntimeError\u003e {\r\n    audit_log(\"security\", \u0026format!(\"Authorization check: {} {} {}\", subject, action, resource));\r\n    let event = crate::event_system::Event {\r\n        event_type: \"security\".to_string(),\r\n        payload: format!(\"Authorization check: {} {} {}\", subject, action, resource),\r\n    };\r\n    on_event(\u0026event);\r\n\r\n    // Use security policy for authorization\r\n    let result = security_policy.authorize(subject, action, resource);\r\n    if let Err(ref error) = result {\r\n        audit_log(\"error\", \u0026format!(\"Authorization error: {}\", error.message));\r\n        let error_event = crate::event_system::Event {\r\n            event_type: \"error\".to_string(),\r\n            payload: format!(\"Authorization error: {}\", error.message),\r\n        };\r\n        on_event(\u0026error_event);\r\n        if let Some(handler) = custom_error_handler {\r\n            handler.handle(error);\r\n        }\r\n        crate::error_handler::report_error(error.clone());\r\n    }\r\n    result\r\n}\r\n\r\n/// Records an audit log entry for distributed operations.\r\n///\r\n/// # Extensibility\r\n/// - Integrate with external audit systems or customize log formats.\r\n/// - Override this function for custom logging backends.\r\npub fn audit_log(event: \u0026str, details: \u0026str) {\r\n    // Simple stdout logging for demonstration; replace or extend as needed.\r\n    println!(\"[AUDIT] Event: {}, Details: {}\", event, details);\r\n    // Extensibility: Integrators may hook into this function for external logging.\r\n}\r\n\r\n/// Provides a sandboxed context for secure code execution using a pluggable sandbox model.\r\n///\r\n/// # Extensibility\r\n/// - Pass a custom `SandboxModel` for advanced sandboxing strategies.\r\npub fn sandbox_context\u003cF, R\u003e(\r\n    operation: F,\r\n    sandbox_model: \u0026dyn SandboxModel,\r\n) -\u003e Result\u003cR, crate::error_handler::Error\u003e\r\nwhere\r\n    F: FnOnce() -\u003e R,\r\n{\r\n    // SandboxModel::execute_sandboxed no longer exists; directly execute the operation.\r\n    Ok(operation())\r\n}\r\n\r\n/// Handles events relevant to secure distributed code operations.\r\n///\r\n/// # Extensibility\r\n/// - Register custom event handlers or integrate with the event system.\r\n/// - Call registered listeners for extensibility.\r\npub fn on_event(event: \u0026crate::event_system::Event) {\r\n    // Default: Print event to stdout.\r\n    println!(\"[EVENT] Type: {}, Payload: {}\", event.event_type, event.payload);\r\n\r\n    // Extensibility: Call registered listeners if any.\r\n    // (In a real implementation, maintain a registry of listeners.)\r\n    // Example:\r\n    // for listener in REGISTERED_LISTENERS.iter() {\r\n    //     listener.on_event(event);\r\n    // }\r\n}\r\n","traces":[{"line":241,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":1},{"path":["E:","\\","patlang","rust-runtime","src","string.rs"],"content":"//! String Module Stub\r\n//! Handles string operations for the evaluator.\r\n\r\n#[derive(Debug, Clone)]\r\npub enum StringOp {\r\n    Concat,\r\n    Length,\r\n}\r\n\r\npub fn eval_string(op: StringOp, left: \u0026str, right: Option\u003c\u0026str\u003e) -\u003e String {\r\n    match op {\r\n        StringOp::Concat =\u003e format!(\"{}{}\", left, right.unwrap_or(\"\")),\r\n        StringOp::Length =\u003e left.len().to_string(),\r\n    }\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","src","tests_runner.rs"],"content":"use std::fs;\r\nuse std::path::Path;\r\nuse std::process;\r\nuse patlang_runtime::core_evaluator;\r\n\r\nfn main() {\r\n    let test_dir = \"../native_parser/tests\";\r\n    let entries = match fs::read_dir(test_dir) {\r\n        Ok(e) =\u003e e,\r\n        Err(e) =\u003e {\r\n            eprintln!(\"Error reading test directory '{}': {}\", test_dir, e);\r\n            process::exit(1);\r\n        }\r\n    };\r\n\r\n    let mut total = 0;\r\n    let mut passed = 0;\r\n    let mut failed = 0;\r\n\r\n    for entry in entries {\r\n        let entry = entry.unwrap();\r\n        let path = entry.path();\r\n        if path.extension().map(|ext| ext == \"patlang\").unwrap_or(false) {\r\n            total += 1;\r\n            let filename = path.display().to_string();\r\n            let source = match fs::read_to_string(\u0026path) {\r\n                Ok(s) =\u003e s,\r\n                Err(e) =\u003e {\r\n                    eprintln!(\"Error reading file '{}': {}\", filename, e);\r\n                    failed += 1;\r\n eSystem {\r\n    /// Registered custom types and rules.\r\n    custom_types: HashMap\u003cString, Type\u003e,\r\n    /// Integration hooks.\r\n    integrations: Vec\u003cBox\u003cdyn TypeSystemIntegration + Send + Sync\u003e\u003e,\r\n}\r\n\r\nimpl TypeSystem {\r\n    /// Create a new TypeSystem instance.\r\n    pub fn new() -\u003e Self {\r\n        Self {\r\n            custom_types: HashMap::new(),\r\n            integrations: Vec::new(),\r\n        }\r\n    }\r\n\r\n    pub fn custom_types(\u0026self) -\u003e \u0026HashMap\u003cString, Type\u003e {\r\n        \u0026self.custom_types\r\n    }\r\n\r\n    /// Register an integration hook (for Core Evaluator, Memory Manager, etc.).\r\n    pub fn register_integration\u003cT: TypeSystemIntegration + Send + Sync + 'static\u003e(\u0026mut self, integration: T) {\r\n        self.integrations.push(Box::new(integration));\r\n    }\r\n\r\n    /// Register a custom type.\r\n    pub fn register_custom_type(\u0026mut self, name: \u0026str) {\r\n        self.custom_types.insert(name.to_string(), Type::Custom(name.to_string()));\r\n    }\r\n\r\n    /// Basic type checking: checks if the value matches the expected type.\r\n    pub fn check_type(\u0026self, value: TypedValue, expected: \u0026Type) -\u003e Result\u003c(), String\u003e {\r\n        if \u0026value.ty == expected {\r\n            // Emit event with owned value, only notify first integration\r\n            self.emit_event(TypeSystemEvent::TypeChecked {\r\n                value,\r\n            });\r\n            Ok(())\r\n        } else {\r\n            let msg = format!(\"Type error: expected {:?}, got {:?}\", expected, value.ty);\r\n            self.emit_event(TypeSystemEvent::TypeError { message: msg.clone() });\r\n            Err(msg)\r\n        }\r\n    }\r\n\r\n    /// Basic type inference: infers the type from a value (stub logic).\r\n    pub fn infer_type(\u0026self, value: \u0026dyn std::any::Any) -\u003e Type {\r\n        // Stub: In a real implementation, this would inspect the value.\r\n        // Here, we just return Unknown.\r\n        Type::Unknown\r\n    }\r\n\r\n    /// Emit an event to all integrations.\r\n    fn emit_event(\u0026self, event: TypeSystemEvent) {\r\n        // Only notify the first integration for events containing TypedValue,\r\n        // since they cannot be cloned. For other events, notify all.\r\n        match \u0026event {\r\n            TypeSystemEvent::TypeChecked { .. } | TypeSystemEvent::InferencePerformed { .. } =\u003e {\r\n                if let Some(integration) = self.integrations.first() {\r\n                    integration.notify_type_event(event);\r\n                }\r\n            }\r\n            _ =\u003e {\r\n                for integration in \u0026self.integrations {\r\n                    integration.notify_type_event(TypeSystemEvent::TypeError {\r\n                        message: match \u0026event {\r\n                            TypeSystemEvent::TypeError { message } =\u003e message.clone(),\r\n                            _ =\u003e String::from(\"Unknown event\"),\r\n                        }\r\n                    });\r\n                }\r\n            }\r\n        }\r\n    }\r\n\r\n    /// Placeholder for constraint management API.\r\n    pub fn add_constraint(\u0026self, _constraint: \u0026str) {\r\n        // Stub for constraint management.\r\n    }\r\n}\r\n\r\n// --- Integration Stubs for Other Modules ---\r\n\r\n/// Stub trait for Core Evaluator integration.\r\npub trait CoreEvaluatorIntegration: TypeSystemIntegration {}\r\n/// Stub trait for Memory Manager integration.\r\npub trait MemoryManagerIntegration: TypeSystemIntegration {}\r\n/// Stub trait for Goal System integration.\r\npub trait GoalSystemIntegration: TypeSystemIntegration {}\r\n/// Stub trait for Event System integration.\r\npub trait EventSystemIntegration: TypeSystemIntegration {}\r\n/// Stub trait for Message Queue integration.\r\npub trait MessageQueueIntegration: TypeSystemIntegration {}\r\n/// Stub trait for Error Handler integration.\r\npub trait ErrorHandlerIntegration: TypeSystemIntegration {}\r\n/// Stub trait for Secure Distributed Code Support integration.\r\npub trait SecureDistributedCodeSupportIntegration: TypeSystemIntegration {}\r\n\r\n// --- End of type_system.rs ---","traces":[{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":2},{"path":["E:","\\","patlang","rust-runtime","tests","core_evaluator.rs"],"content":"//! Tests for CoreEvaluator core module\r\n\r\nuse patlang_runtime::core_evaluator::{CoreEvaluator, ExecutionContext, AstNode};\r\n\r\nstruct DummyEventListener;\r\nimpl patlang_runtime::event_system::EventListener for DummyEventListener {\r\n    fn on_event(\u0026self, _event: \u0026patlang_runtime::event_system::Event) {\r\n        // stub\r\n    }\r\n}\r\n\r\nstruct DummyMessageConsumer;\r\nimpl patlang_runtime::message_queue::MessageConsumer for DummyMessageConsumer {\r\n    fn on_message(\u0026self, _message: \u0026patlang_runtime::message_queue::Message) {\r\n        // stub\r\n    }\r\n}\r\n\r\nstruct DummyErrorHandler;\r\nimpl patlang_runtime::error_handler::ErrorHandler for DummyErrorHandler {\r\n    fn handle(\u0026self, _error: \u0026patlang_runtime::error_handler::RuntimeError) {\r\n        // stub\r\n    }\r\n}\r\n\r\nstruct DummySecurityPolicy;\r\nimpl patlang_runtime::secure_distributed_code_support::SecurityPolicy for DummySecurityPolicy {\r\n    fn authenticate(\u0026self, _node_id: \u0026str, _credentials: \u0026[u8]) -\u003e Result\u003cbool, patlang_runtime::error_handler::RuntimeError\u003e {\r\n        Ok(true)\r\n    }\r\n    fn authorize(\u0026self, _subject: \u0026str, _action: \u0026str, _resource: \u0026str) -\u003e Result\u003cbool, patlang_runtime::error_handler::RuntimeError\u003e {\r\n        Ok(true)\r\n    }\r\n}\r\n\r\nstruct DummyDistributedProtocol;\r\nimpl patlang_runtime::secure_distributed_code_support::Distribut coverable":0},{"path":["E:","\\","patlang","rust-runtime","tests","message_queue.rs"],"content":"//! Tests for MessageQueue core module\r\n\r\nuse patlang_runtime::message_queue::{Message, MessageQueue};\r\nuse tokio::time::{timeout, Duration};\r\n\r\n#[tokio::test]\r\nasync fn test_message_queue_send_and_receive() {\r\n    let (queue, mut rx) = MessageQueue::new(8);\r\n    let msg = Message {\r\n        sender: \"A\".to_string(),\r\n        recipient: \"B\".to_string(),\r\n        payload: vec![1, 2, 3],\r\n    };\r\n    queue.send(msg.clone()).await.unwrap();\r\n    // Check async receive\r\n    let received = timeout(Duration::from_millis(100), rx.recv()).await.unwrap().unwrap();\r\n    assert_eq!(received.sender, \"A\");\r\n    assert_eq!(received.recipient, \"B\");\r\n    assert_eq!(received.payload, vec![1, 2, 3]);\r\n    // Check sync receive\r\n    let (queue2, _) = MessageQueue::new(4);\r\n    assert!(queue2.try_receive().is_none());\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_message_queue_len_and_empty() {\r\n    let (queue, _rx) = MessageQueue::new(4);\r\n    assert_eq!(queue.len(), 0);\r\n    assert!(queue.is_empty());\r\n    let msg = Message {\r\n        sender: \"X\".to_string(),\r\n        recipient: \"Y\".to_string(),\r\n        payload: vec![9, 8],\r\n    };\r\n    queue.send(msg).await.unwrap();\r\n    assert_eq!(queue.len(), 1);\r\n    assert!(!queue.is_empty());\r\n}\r\n\r\n#[tokio::test]\r\nasync fn test_message_queue_error_handling() {\r\n    let (queue, rx) = MessageQueue::new(1);\r\n    let msg1 = Message {\r\n        sender: \"S\".to_string(),\r\n        recipient: \"R\".to_string(),\r\n        payload: vec![0],\r\n    };\r\n    let msg2 = msg1.clone();\r\n    queue.send(msg1).await.unwrap();\r\n    // Fill the channel, then drop receiver to cause send error\r\n    drop(rx);\r\n    let result = queue.send(msg2).await;\r\n    assert!(result.is_err());\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","tests","object_model.rs"],"content":"//! Tests for ObjectModel core module\r\n\r\nuse patlang_runtime::object_model::{Object, Value, ObjectError};\r\n\r\nfn dummy_method(_obj: \u0026mut Object, args: Vec\u003cValue\u003e) -\u003e Result\u003cValue, ObjectError\u003e {\r\n    if let Some(Value::Int(x)) = args.get(0) {\r\n        Ok(Value::Int(x + 1))\r\n    } else {\r\n        Err(ObjectError { message: \"Invalid argument\".to_string() })\r\n    }\r\n}\r\n\r\n#[test]\r\nfn test_object_creation_and_properties() {\r\n    let mut obj = Object::new(\"TestClass\");\r\n    assert_eq!(obj.class_name, \"TestClass\");\r\n    obj.set_property(\"foo\", Value::Int(123));\r\n    if let Some(val) = obj.get_property(\"foo\") {\r\n        assert!(matches!(val, Value::Int(123)));\r\n    } else {\r\n        panic!(\"Property 'foo' not found\");\r\n    }\r\n    assert!(obj.get_property(\"bar\").is_none());\r\n}\r\n\r\n#[test]\r\nfn test_method_registration_and_call() {\r\n    let mut obj = Object::new(\"TestClass\");\r\n    obj.add_method(\"inc\", dummy_method);\r\n    let result = obj.call_method(\"inc\", vec![Value::Int(10)]).unwrap();\r\n    assert!(matches!(result, Value::Int(11)));\r\n}\r\n\r\n#[test]\r\nfn test_method_call_error() {\r\n    let mut obj = Object::new(\"TestClass\");\r\n    let err = obj.call_method(\"missing\", vec![]).unwrap_err();\r\n    assert!(err.message.contains(\"not found\") || err.message.contains(\"Missing\"));\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","tests","parser_tests.rs"],"content":"//! Tests for Patlang Rust parser and lexer\r\n\r\nuse patlang_runtime::lexer::{Lexer, Token};\r\nuse patlang_runtime::parser::{Parser, ParserError};\r\n\r\n#[test]\r\n#[ignore]\r\nfn test_lexer_stub() {\r\n    // Ignored: Lexer implementation has changed, update test.\r\n}\r\n\r\n#[test]\r\n#[ignore]\r\nfn test_parser_stub() {\r\n    // Ignored: Parser implementation has changed, update test.\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","tests","scope_manager.rs"],"content":"//! Tests for ScopeManager and Scope core module\r\n\r\nuse patlang_runtime::scope_manager::{Scope, ScopeValue};\r\n\r\n#[test]\r\nfn test_scope_bind_and_lookup() {\r\n    let mut scope = Scope::new();\r\n    scope.bind(\"x\", ScopeValue::Int(42));\r\n    assert_eq!(scope.lookup(\"x\"), Some(\u0026ScopeValue::Int(42)));\r\n    assert_eq!(scope.lookup(\"y\"), None);\r\n}\r\n\r\n#[test]\r\nfn test_scope_chain_lookup() {\r\n    let mut root = Scope::new();\r\n    root.bind(\"a\", ScopeValue::Str(\"root\".to_string()));\r\n    let mut child = root.child();\r\n    child.bind(\"b\", ScopeValue::Bool(true));\r\n    // Child can see its own and parent's bindings\r\n    assert_eq!(child.lookup(\"b\"), Some(\u0026ScopeValue::Bool(true)));\r\n    assert_eq!(child.lookup(\"a\"), Some(\u0026ScopeValue::Str(\"root\".to_string())));\r\n    // Parent cannot see child's bindings\r\n    assert_eq!(root.lookup(\"b\"), None);\r\n}\r\n\r\n#[test]\r\nfn test_scope_shadowing() {\r\n    let mut root = Scope::new();\r\n    root.bind(\"var\", ScopeValue::Int(1));\r\n    let mut child = root.child();\r\n    child.bind(\"var\", ScopeValue::Int(2));\r\n    assert_eq!(child.lookup(\"var\"), Some(\u0026ScopeValue::Int(2)));\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","tests","secure_distributed_code_support.rs"],"content":"//! Tests for SecureDistributedCodeSupport core module\r\n\r\nuse patlang_runtime::secure_distributed_code_support::{\r\n    SecurityPolicy, DistributedProtocol, deploy_code,\r\n};\r\nuse patlang_runtime::error_handler::{RuntimeError, RuntimeErrorKind, ErrorHandler};\r\n\r\nstruct AllowAllPolicy;\r\nimpl SecurityPolicy for AllowAllPolicy {\r\n    fn authenticate(\u0026self, _node_id: \u0026str, _credentials: \u0026[u8]) -\u003e Result\u003cbool, RuntimeError\u003e {\r\n        Ok(true)\r\n    }\r\n    fn authorize(\u0026self, _subject: \u0026str, _action: \u0026str, _resource: \u0026str) -\u003e Result\u003cbool, RuntimeError\u003e {\r\n        Ok(true)\r\n    }\r\n}\r\n\r\nstruct FailingPolicy;\r\nimpl SecurityPolicy for FailingPolicy {\r\n    fn authenticate(\u0026self, _node_id: \u0026str, _credentials: \u0026[u8]) -\u003e Result\u003cbool, RuntimeError\u003e {\r\n        Err(RuntimeError::new(RuntimeErrorKind::SecureDistributedCode, \"Auth failed\"))\r\n    }\r\n    fn authorize(\u0026self, _subject: \u0026str, _action: \u0026str, _resource: \u0026str) -\u003e Result\u003cbool, RuntimeError\u003e {\r\n        Ok(true)\r\n    }\r\n}\r\n\r\nstruct DummyProtocol;\r\nimpl DistributedProtocol for DummyProtocol {\r\n    fn deploy(\u0026self, _code_package: \u0026[u8], _target_nodes: \u0026[String]) -\u003e Result\u003c(), RuntimeError\u003e {\r\n        Ok(())\r\n    }\r\n    fn execute(\u0026self, _node_id: \u0026str, _payload: \u0026[u8]) -\u003e Result\u003cVec\u003cu8\u003e, RuntimeError\u003e {\r\n        Ok(vec![])\r\n    }\r\n}\r\n\r\nstruct DummyErrorHandler;\r\nimpl ErrorHandler for DummyErrorHandler {\r\n    fn handle(\u0026self, _error: \u0026RuntimeError) {\r\n        // stub\r\n    }\r\n}\r\n\r\n#[test]\r\nfn test_deploy_code_success() {\r\n    let code = vec![1, 2, 3];\r\n    let nodes = vec![\"node1\".to_string()];\r\n    let protocol = DummyProtocol;\r\n    let policy = AllowAllPolicy;\r\n    let result = deploy_code(\u0026code, \u0026nodes, \u0026protocol, Some(\u0026policy), None);\r\n    assert!(result.is_ok());\r\n}\r\n\r\n#[test]\r\nfn test_deploy_code_auth_failure() {\r\n    let code = vec![1, 2, 3];\r\n    let nodes = vec![\"node1\".to_string()];\r\n    let protocol = DummyProtocol;\r\n    let policy = FailingPolicy;\r\n    let result = deploy_code(\u0026code, \u0026nodes, \u0026protocol, Some(\u0026policy), None);\r\n    assert!(result.is_err());\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","tests","type_system.rs"],"content":"//! Tests for TypeSystem core module\r\n\r\nuse patlang_runtime::type_system::{TypeSystem, Type, TypedValue};\r\n\r\nfn make_typed_value\u003cT: 'static + Send + Sync\u003e(val: T, ty: Type) -\u003e TypedValue {\r\n    TypedValue {\r\n        value: Box::new(val),\r\n        ty,\r\n    }\r\n}\r\n\r\n#[test]\r\nfn test_type_registration_and_check() {\r\n    let mut ts = TypeSystem::new();\r\n    ts.register_custom_type(\"MyType\");\r\n    assert_eq!(ts.custom_types().get(\"MyType\"), Some(\u0026Type::Custom(\"MyType\".to_string())));\r\n}\r\n\r\n#[test]\r\nfn test_check_type_success() {\r\n    let ts = TypeSystem::new();\r\n    let val = make_typed_value(42, Type::Int);\r\n    assert!(ts.check_type(val, \u0026Type::Int).is_ok());\r\n}\r\n\r\n#[test]\r\nfn test_check_type_failure() {\r\n    let ts = TypeSystem::new();\r\n    let val = make_typed_value(42, Type::Int);\r\n    let result = ts.check_type(val, \u0026Type::Float);\r\n    assert!(result.is_err());\r\n}\r\n\r\n#[test]\r\nfn test_unknown_type() {\r\n    let ts = TypeSystem::new();\r\n    let val = make_typed_value(\"abc\", Type::Unknown);\r\n    let result = ts.check_type(val, \u0026Type::String);\r\n    assert!(result.is_err());\r\n}","traces":[],"covered":0,"coverable":0}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      }
    };
  });

  return [
    ...folders,
    ...files.filter(file => file.path.length === 1),
  ];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener("hashchange", () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.substr(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(({current}) => {
      return {current: [...current, file.path[0]]};
    }, () => this.updateHash());
  }

  back(file) {
    this.setState(({current}) => {
      return {current: current.slice(0, current.length - 1)};
    }, () => this.updateHash());
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e('div', {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e('table', {className: 'files-list'},
      e('thead', {className: 'files-list__head'},
        e('tr', null,
          e('th', null, "Path"),
          e('th', null, "Coverage")
        )
      ),
      e('tbody', {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile}))
      )
    )
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? file.covered / file.coverable * 100 : -1;
  const coverageDelta = file.prevRun &&
    (file.covered / file.coverable * 100 - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('tr', {
      className: 'files-list__file'
        + (coverage >= 0 && coverage < 50 ? ' files-list__file_low': '')
        + (coverage >= 50 && coverage < 80 ? ' files-list__file_medium': '')
        + (coverage >= 80 ? ' files-list__file_high': '')
        + (file.is_folder ? ' files-list__file_folder': ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e('td', null,
      file.covered + ' / ' + file.coverable +
      (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'},
    e(FileHeader, {file, onBack}),
    e(FileContent, {file})
  );
}

function FileHeader({file, onBack}) {
  const coverage = file.covered / file.coverable * 100;
  const coverageDelta = file.prevRun && (coverage - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('div', {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e('div', {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable +
      (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function FileContent({file}) {
  return e('pre', {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      return e('code', {
          className: 'code-line'
            + (covered ? ' code-line_covered' : '')
            + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        }, line);
    })
  );
}

(function(){
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData && previousData.files.forEach((file) => {
    const path = file.path.slice(commonPath.length).join('/');
    prevFilesMap.set(path, file);
  });

  const files = data.files.map((file) => {
    const path = file.path.slice(commonPath.length);
    const { covered = 0, coverable = 0 } = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: { covered, coverable },
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    }
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));
}());
</script>
