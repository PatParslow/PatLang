d(\u0026goal);\r\n        }\r\n    }\r\n\r\n    /// Pursue a goal by id (basic logic, no concurrency/distributed yet).\r\n    pub fn pursue_goal(\u0026self, id: \u0026GoalId) {\r\n        let mut goals = self.goals.lock().unwrap();\r\n        if let Some(goal) = goals.get_mut(id) {\r\n            goal.status = GoalStatus::InProgress;\r\n            for listener in self.listeners.lock().unwrap().iter() {\r\n                listener.on_goal_pursued(goal);\r\n            }\r\n            // Placeholder for actual pursuit logic.\r\n            // Simulate completion for now.\r\n            goal.status = GoalStatus::Completed;\r\n            for listener in self.listeners.lock().unwrap().iter() {\r\n                listener.on_goal_completed(goal);\r\n            }\r\n        }\r\n    }\r\n\r\n    /// Get the status of a goal.\r\n    pub fn get_goal_status(\u0026self, id: \u0026GoalId) -\u003e Option\u003cGoalStatus\u003e {\r\n        self.goals.lock().unwrap().get(id).map(|g| g.status.clone())\r\n    }\r\n\r\n    /// List all goals.\r\n    pub fn list_goals(\u0026self) -\u003e Vec\u003cGoal\u003e {\r\n        self.goals.lock().unwrap().values().cloned().collect()\r\n    }\r\n\r\n    // Extensibility: Add methods for concurrent/distributed execution here.\r\n    // (Stubbed for now)\r\n}\r\n","traces":[{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"stats":{"Line":432345564227567616}},{"line":71,"address":[],"length":0,"stats":{"Line":1297036692682702848}},{"line":72,"address":[],"length":0,"stats":{"Line":1297036692682702848}},{"line":83,"address":[],"length":0,"stats":{"Line":216172782113783808}},{"line":84,"address":[],"length":0,"stats":{"Line":648518346341351424}},{"line":88,"address":[],"length":0,"stats":{"Line":432345564227567616}},{"line":90 003cBox\u003cdyn MemoryManager\u003e\u003e,\r\n    pub goal_system: Option\u003cBox\u003cdyn GoalSystem\u003e\u003e,\r\n    pub type_system: Option\u003cBox\u003cdyn TypeSystem\u003e\u003e,\r\n    pub event_system: Option\u003cBox\u003cdyn EventSystem\u003e\u003e,\r\n    pub message_queue: Option\u003cBox\u003cdyn MessageQueue\u003e\u003e,\r\n    pub error_handler: Option\u003cBox\u003cdyn ErrorHandler\u003e\u003e,\r\n    pub secure_code_support: Option\u003cBox\u003cdyn SecureDistributedCodeSupport\u003e\u003e,\r\n}\r\n\r\nimpl InferencingEngine {\r\n    /// Create a new Inferencing Engine with optional integrations.\r\n    pub fn new() -\u003e Self {\r\n        Self {\r\n            evaluator: None,\r\n            memory_manager: None,\r\n            goal_system: None,\r\n            type_system: None,\r\n            event_system: None,\r\n            message_queue: None,\r\n            error_handler: None,\r\n            secure_code_support: None,\r\n        }\r\n    }\r\n\r\n    /// Perform logical inference on a given goal.\r\n    pub fn infer(\u0026self, goal: \u0026Goal) -\u003e InferenceResult {\r\n        // Basic logic: delegate to goal system and evaluator if present.\r\n        if let (Some(goal_sys), Some(eval)) = (\u0026self.goal_system, \u0026self.evaluator) {\r\n            let plan = goal_sys.plan(goal);\r\n            eval.evaluate(plan)\r\n        } else {\r\n            InferenceResult::error(\"Integration missing\")\r\n        }\r\n    }\r\n\r\n    /// Attempt to unify two terms.\r\n    pub fn unify(\u0026self, a: \u0026Term, b: \u0026Term) -\u003e UnificationResult {\r\n        // Basic logic: structural equality for now.\r\n        if a == b {\r\n            UnificationResult::success()\r\n        } else {\r\n            UnificationResult::failure()\r\n        }\r\n    }\r\n\r\n    /// Distributed reasoning API stub.\r\n    pub fn distributed_reason(\u0026self, _goal: \u0026Goal) -\u003e DistributedReasoningResult {\r\n        // Not implemented yet.\r\n        DistributedReasoningResult::not_implemented()\r\n    }\r\n\r\n    /// Extensibility: register a custom inference strategy.\r\n    pub fn register_strategy(\u0026mut self, _strategy: Box\u003cdyn InferenceStrategy\u003e) {\r\n        // Stub for extensibility.\r\n    }\r\n}\r\n\r\n// --- Traits for integration points (stubs) ---\r\n\r\n/// Core Evaluator trait.\r\npub trait CoreEvaluator {\r\n    fn evaluate(\u0026self, plan: Plan) -\u003e InferenceResult;\r\n}\r\n\r\n/// Memory Manager trait.\r\npub trait MemoryManager {}\r\n\r\n/// Goal System trait.\r\npub trait GoalSystem {\r\n    fn plan(\u0026self, goal: \u0026Goal) -\u003e Plan;\r\n}\r\n\r\n/// Type System trait.\r\npub trait TypeSystem {}\r\n\r\n/// Event System trait.\r\npub trait EventSystem {}\r\n\r\n/// Message Queue trait.\r\npub trait MessageQueue {}\r\n\r\n/// Error Handler trait.\r\npub trait ErrorHandler {}\r\n\r\n/// Secure Distributed Code Support trait.\r\npub trait SecureDistributedCodeSupport {}\r\n\r\n/// Inference Strategy trait for extensibility.\r\npub trait InferenceStrategy {\r\n    fn infer(\u0026self, engine: \u0026InferencingEngine, goal: \u0026Goal) -\u003e InferenceResult;\r\n}\r\n\r\n// --- Data structures (stubs) ---\r\n\r\n#[derive(Debug, PartialEq, Eq)]\r\npub enum Term {\r\n    Int(i64),\r\n    // Add other variants as needed\r\n}\r\n\r\npub struct Goal; // Placeholder for goal representation.\r\n\r\nimpl Default for Goal {\r\n    fn default() -\u003e Self {\r\n        Goal {}\r\n    }\r\n}\r\npub struct Plan; // Placeholder for plan representation.\r\n\r\npub struct InferenceResult {\r\n    pub success: bool,\r\n    pub message: Option\u003cString\u003e,\r\n}\r\n\r\nimpl InferenceResult {\r\n    pub fn error(msg: \u0026str) -\u003e Self {\r\n        Self { success: false, message: Some(msg.to_string()) }\r\n    }\r\n}\r\n\r\npub struct UnificationResult {\r\n    pub unified: bool,\r\n}\r\n\r\nimpl UnificationResult {\r\n    pub fn success() -\u003e Self { Self { unified: true } }\r\n    pub fn failure() -\u003e Self { Self { unified: false } }\r\n    pub fn is_success(\u0026self) -\u003e bool {\r\n        self.unified\r\n    }\r\n    pub fn is_failure(\u0026self) -\u003e bool {\r\n        !self.unified\r\n    }\r\n}\r\n\r\npub struct DistributedReasoningResult;\r\n\r\nimpl DistributedReasoningResult {\r\n    pub fn not_implemented() -\u003e Self { Self }\r\n\r\n    pub fn is_not_implemented(\u0026self) -\u003e bool {\r\n        true\r\n    }\r\n}","traces":[{"line":24,"address":[],"length":0,"stats":{"Line":216172782113783808}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":51,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":52,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":54,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":59,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":61,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":65,"address":[],"length":0,"stats":{"Line":0}},{"line":116,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":128,"address":[],"length":0,"stats":{"Line":0}},{"line":129,"address":[],"length":0,"stats":{"Line":0}},{"line":138,"address":[],"length":0,"stats":{"Line":216172782113783808}},{"line":139,"address":[],"length":0,"stats":{"Line":216172782113783808}},{"line":140,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":141,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":143,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":144,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":151,"address":[],"length":0,"stats": ;\r\n                return Ok(Token::Newline);\r\n            }\r\n            // Skip whitespace (except newline)\r\n            if c.is_whitespace() \u0026\u0026 c != '\\n' {\r\n                self.position += 1;\r\n                continue;\r\n            }\r\n            // Skip comments\r\n            if c == '#' {\r\n                while self.position \u003c len \u0026\u0026 bytes[self.position] as char != '\\n' {\r\n                    self.position += 1;\r\n                }\r\n                continue;\r\n            }\r\n            // Numbers (integer only for now)\r\n            if c.is_ascii_digit() {\r\n                let start = self.position;\r\n                while self.position \u003c len \u0026\u0026 (bytes[self.position] as char).is_ascii_digit() {\r\n                    self.position += 1;\r\n                }\r\n                let num_str = \u0026self.input[start..self.position];\r\n                let num = num_str.parse::\u003cf64\u003e().unwrap_or(0.0);\r\n                println!(\"[DEBUG][lexer] Returning Token::Number({})\", num);\r\n                return Ok(Token::Number(num));\r\n            }\r\n            // Identifiers and keywords\r\n            if c.is_ascii_alphabetic() || c == '_' {\r\n                let start = self.position;\r\n                self.position += 1;\r\n                while self.position \u003c len {\r\n                    let nc = bytes[self.position] as char;\r\n                    if nc.is_ascii_alphanumeric() || nc == '_' {\r\n                        self.position += 1;\r\n                    } else {\r\n                        break;\r\n                    }\r\n                }\r\n                let ident = \u0026self.input[start..self.position];\r\n                println!(\"[DEBUG][lexer] Returning Token::Identifier({})\", ident);\r\n                return Ok(match ident {\r\n                    \"let\" =\u003e Token::Let,\r\n                    \"fn\" =\u003e Token::Fn,\r\n                    \"return\" =\u003e Token::Return,\r\n                    \"goal\" =\u003e Token::Goal,\r\n                    \"rule\" =\u003e Token::Rule,\r\n                    \"true\" | \"false\" =\u003e Token::Identifier(ident.to_string()), // treat as identifier for now\r\n                    \"not\" | \"and\" | \"or\" | \"print\" =\u003e Token::Identifier(ident.to_string()),\r\n                    _ =\u003e Token::Identifier(ident.to_string()),\r\n                });\r\n            }\r\n            // Block delimiters (for future use, e.g. '{' and '}')\r\n            if c == '{' {\r\n                self.position += 1;\r\n                return Ok(Token::BlockStart);\r\n            }\r\n            if c == '}' {\r\n                self.position += 1;\r\n                return Ok(Token::BlockEnd);\r\n            }\r\n            // String literals\r\n            if c == '\"' {\r\n                self.position += 1;\r\n                let start = self.position;\r\n                while self.position \u003c len \u0026\u0026 bytes[self.position] as char != '\"' {\r\n                    // Handle escape sequences later\r\n                    self.position += 1;\r\n                }\r\n                let s = \u0026self.input[start..self.position];\r\n                if self.position \u003c len \u0026\u0026 bytes[self.position] as char == '\"' {\r\n                    self.position += 1;\r\n                    println!(\"[DEBUG][lexer] Returning Token::String({})\", s);\r\n                    return Ok(Token::String(s.to_string()));\r\n                } else {\r\n                    return Err(LexerError::UnterminatedString(self.position));\r\n                }\r\n            }\r\n            // Operators and parens\r\n            self.position += 1;\r\n            let token = match c {\r\n                '+' =\u003e Token::Plus,\r\n                '-' =\u003e Token::Minus,\r\n                '*' =\u003e Token::Star,\r\n                '/' =\u003e Token::Slash,\r\n                '%' =\u003e Token::Percent,\r\n                '(' =\u003e Token::LParen,\r\n                ')' =\u003e Token::RParen,\r\n                ',' =\u003e Token::Comma,\r\n                '=' =\u003e {\r\n                    // Check for ==\r\n                    if self.position \u003c len \u0026\u0026 bytes[self.position] as char == '=' {\r\n                        self.position += 1;\r\n                        Token::EqualEqual\r\n                    } else {\r\n                        Token::Equal\r\n                    }\r\n                },\r\n                '\u003e' =\u003e {\r\n                    // Check for \u003e=\r\n                    if self.position \u003c len \u0026\u0026 bytes[self.position] as char == '=' {\r\n                        self.position += 1;\r\n                        Token::GreaterEqual\r\n                    } else {\r\n                        Token::Greater\r\n                    }\r\n                },\r\n                '\u003c' =\u003e {\r\n                    // Check for \u003c=\r\n                    if self.position \u003c len \u0026\u0026 bytes[self.position] as char == '=' {\r\n                        self.position += 1;\r\n                        Token::LessEqual\r\n                    } else {\r\n                        Token::Less\r\n                    }\r\n                },\r\n                _ =\u003e Token::EOF,\r\n            };\r\n            println!(\"[DEBUG][lexer] Returning {:?}\", token);\r\n            return Ok(token);\r\n        }\r\n        println!(\"[DEBUG][lexer] Returning Token::EOF\");\r\n        Ok(Token::EOF)\r\n    }\r\n}","traces":[{"line":50,"address":[],"length":0,"stats":{"Line":648518346341351424}},{"line":51,"address":[],"length":0,"stats":{"Line":1297036692682702848}},{"line":55,"address":[],"length":0,"stats":{"Line":2594073385365405696}},{"line":56,"address":[],"length":0,"stats":{"Line":7782220156096217088}},{"line":57,"address":[],"length":0,"stats":{"Line":7782220156096217088}},{"line":58, pe for object operations (stub for integration with error handler).\r\n#[derive(Debug)]\r\npub struct ObjectError {\r\n    pub message: String,\r\n}\r\n\r\n/// Core object structure.\r\n#[derive(Debug)]\r\npub struct Object {\r\n    pub class_name: String,\r\n    pub properties: HashMap\u003cString, Value\u003e,\r\n    pub methods: HashMap\u003cString, Method\u003e,\r\n    // Future: parent/inheritance, type info, memory integration, etc.\r\n}\r\n\r\nimpl Object {\r\n    /// Creates a new object with the given class name.\r\n    pub fn new(class_name: \u0026str) -\u003e Self {\r\n        Object {\r\n            class_name: class_name.to_string(),\r\n            properties: HashMap::new(),\r\n            methods: HashMap::new(),\r\n        }\r\n    }\r\n\r\n    /// Sets a property value.\r\n    pub fn set_property(\u0026mut self, key: \u0026str, value: Value) {\r\n        self.properties.insert(key.to_string(), value);\r\n    }\r\n\r\n    /// Gets a property value.\r\n    pub fn get_property(\u0026self, key: \u0026str) -\u003e Option\u003c\u0026Value\u003e {\r\n        self.properties.get(key)\r\n    }\r\n\r\n    /// Registers a method.\r\n    pub fn add_method(\u0026mut self, name: \u0026str, method: Method) {\r\n        self.methods.insert(name.to_string(), method);\r\n    }\r\n\r\n    /// Calls a method by name.\r\n    pub fn call_method(\u0026mut self, name: \u0026str, args: Vec\u003cValue\u003e) -\u003e Result\u003cValue, ObjectError\u003e {\r\n        if let Some(method) = self.methods.get(name) {\r\n            method(self, args)\r\n        } else {\r\n            Err(ObjectError {\r\n                message: format!(\"Method '{}' not found on '{}'\", name, self.class_name),\r\n            })\r\n        }\r\n    }\r\n}\r\n\r\n// --- Integration Stubs ---\r\n\r\n/// Integration with Core Evaluator.\r\npub trait EvaluatorIntegration {\r\n    fn eval_object(\u0026self, obj: \u0026Object) -\u003e Result\u003cValue, ObjectError\u003e;\r\n}\r\n\r\n/// Integration with Memory Manager.\r\npub trait MemoryManagerIntegration {\r\n    fn allocate_object(\u0026self, obj: Object) -\u003e Arc\u003cMutex\u003cObject\u003e\u003e;\r\n}\r\n\r\n/// Integration with Goal System.\r\npub trait GoalSystemIntegration {\r\n    fn register_object_goal(\u0026self, obj: \u0026Object);\r\n}\r\n\r\n/// Integration with Type System.\r\npub trait TypeSystemIntegration {\r\n    fn get_object_type(\u0026self, obj: \u0026Object) -\u003e String;\r\n}\r\n\r\n/// Integration with Inferencing Engine.\r\npub trait InferencingEngineIntegration {\r\n    fn infer_object_properties(\u0026self, obj: \u0026Object);\r\n}\r\n\r\n/// Integration with Scope Manager.\r\npub trait ScopeManagerIntegration {\r\n    fn bind_object(\u0026self, name: \u0026str, obj: Arc\u003cMutex\u003cObject\u003e\u003e);\r\n}\r\n\r\n/// Integration with Event System.\r\npub trait EventSystemIntegration {\r\n    fn emit_object_event(\u0026self, obj: \u0026Object, event: \u0026str);\r\n}\r\n\r\n/// Integration with Message Queue.\r\npub trait MessageQueueIntegration {\r\n    fn queue_object_message(\u0026self, obj: \u0026Object, message: \u0026str);\r\n}\r\n\r\n/// Integration with Error Handler.\r\npub trait ErrorHandlerIntegration {\r\n    fn handle_object_error(\u0026self, error: \u0026ObjectError);\r\n}\r\n\r\n/// Integration with Secure Distributed Code Support.\r\npub trait SecureDistributedCodeIntegration {\r\n    fn authorize_object_action(\u0026self, obj: \u0026Object, action: \u0026str) -\u003e bool;\r\n}\r\n\r\n// --- Example Usage (for future tests) ---\r\n// let mut obj = Object::new(\"Example\");\r\n// obj.set_property(\"x\", Value::Int(42));\r\n// obj.add_method(\"get_x\", |o, _| o.get_property(\"x\").cloned().ok_or(ObjectError{message: \"No x\".into()}));","traces":[{"line":48,"address":[],"length":0,"stats":{"Line":216172782113783808}},{"line":50,"address":[],"length":0,"stats":{"Line":648518346341351424}},{"line":51,"address":[],"length":0,"stats":{"Line":216172782113783808}},{"line":52,"address":[],"length":0,"stats":{"Line":216172782113783808}},{"line":57,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":58,"address":[],"length":0,"stats":{"Line":360287970189639680}},{"line":62,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":63,"address":[],"length":0,"stats":{"Line":432345564227567616}},{"line":67,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":68,"address":[],"length":0,"stats":{"Line":360287970189639680}},{"line":72,"address":[],"length":0,"stats":{"Line":144115188075855872}},{"line":73,"address":[],"length":0,"stats":{"Line":360287970189639680}},{"line":74,"address":[],"length":0,"stats":{"Line":0}},{"line":76,"address":[],"length":0,"stats":{"Line":72057594037927936}},{"line":77,"address":[],"length":0,"stats":{"Line":72057594037927936}}],"covered":14,"coverable":15},{"path":["E:","\\","patlang","rust-runtime","src","parser.rs"],"content":"/// Patlang Parser for Rust\r\n\r\nuse crate::lexer::{Lexer, Token, LexerError};\r\nuse crate::ast;\r\n\r\nuse ast::{Expr, Stmt};\r\n\r\n#[derive(Debug)]\r\npub enum ParserError {\r\n    UnexpectedToken(Token),\r\n    UnexpectedEOF,\r\n    LexerError(LexerError),\r\n    // Extend with more error types as needed\r\n}\r\n\r\npub struct Parser\u003c'a\u003e {\r\n    lexer: Lexer\u003c'a\u003e,\r\n    current_token: Token,\r\n}\r\n\r\nimpl\u003c'a\u003e Parser\u003c'a\u003e {\r\n    pub fn new(input: \u0026'a str) -\u003e Result\u003cSelf, ParserError\u003e {\r\n        let mut lexer = Lexer::new(input);\r\n        let first_token = lexer.next_token().map_err(ParserError::LexerError)?;\r\n        Ok(Parser { lexer, current_token: first_token })\r\n    }\r\n\r\n    pub fn parse(\u0026mut self) -\u003e Result\u003cVec\u003cStmt\u003e, ParserError\u003e {\r\n        let mut statements = Vec::new();\r\n        let mut statement_count = 0;\r\n        loop {\r\n            println!(\"[DEBUG][parse] Top of loop: current_token = {:?}\", self.current_token);\r\n            // Skip all newlines before a statement\r\n            while self.current_token == Token::Newline {\r\n                println!(\"[DEBUG][parse] Skipping newline before statement\");\r\n                self.advance()?;\r\n            }\r\n            // If we hit EOF after skipping newlines, we're done\r\n            if self.current_token == Token::EOF {\r\n                println!(\"[DEBUG][parse] Hit EOF after skipping newlines, breaking\");\r\n                break;\r\n            }\r\n            // If the next token is not a valid statement start, break\r\n            match self.current_token {\r\n                Token::Identifier(_) | Token::Number(_) | Token::String(_) | Token::LParen =\u003e {},\r\n                Token::EOF =\u003e {\r\n                    println!(\"[DEBUG][parse] Hit EOF, breaking\");\r\n                    break;\r\n                },\r\n                ref t =\u003e {\r\n                    println!(\"[DEBUG][parse] Unexpected token at statement start: {:?}\", t);\r\n                    break;\r\n                }\r\n            }\r\n            let stmt = self.parse_statement()?;\r\n            statement_count += 1;\r\n            println!(\"[DEBUG][parse] Parsed statement #{}: {:?}\", statement_count, stmt);\r\n            statements.push(stmt);\r\n            // Skip all newlines after a statement\r\n            while self.current_token == Token::Newline {\r\n                println!(\"[DEBUG][parse] Skipping newline after statement\");\r\n                self.advance()?;\r\n            }\r\n            // If we hit EOF after skipping newlines, we're done\r\n            if self.current_token == Token::EOF {\r\n                println!(\"[DEBUG][parse] Hit EOF after statement, breaking\");\r\n                break;\r\n            }\r\n        }\r\n        println!(\"[DEBUG][parse] Finished parsing. Total statements: {}\", statement_count);\r\n        Ok(statements)\r\n    }\r\n\r\n    fn parse_statement(\u0026mut self) -\u003e Result\u003cStmt, ParserError\u003e {\r\n        // Dispatch to subparsers based on current_token\r\n        match \u0026self.current_token {\r\n            Token::Goal =\u003e self.parse_goal_block(),\r\n            Token::Rule =\u003e self.parse_rule_block(),\r\n            _ =\u003e self.parse_expression_statement(),\r\n        }\r\n    }\r\n    \r\n    // Stub implementations for goal/rule blocks\r\n    fn parse_goal_block(\u0026mut self) -\u003e Result\u003cStmt, ParserError\u003e {\r\n        // For now, just consume the 'goal' token and the next identifier, then skip to next newline or EOF\r\n        self.advance()?; // consume 'goal'\r\n        let name = if let Token::Identifier(ref s) = self.current_token {\r\n            s.clone()\r\n        } else {\r\n            return Err(ParserError::UnexpectedToken(self.current_token.clone()));\r\n        };\r\n        self.advance()?; // consume identifier\r\n        // Optionally parse parameters, block, etc.\r\n        // For now, skip to next newline or EOF\r\n        while self.current_token != Token::EOF \u0026\u0026 self.current_token != Token::Newline {\r\n            self.advance()?;\r\n        }\r\n        Ok(Stmt::ExprStmt(Expr::Identifier(format!(\"goal:{}\", name))))\r\n    }\r\n    \r\n    fn parse_rule_block(\u0026mut self) -\u003e Result\u003cStmt, ParserError\u003e {\r\n        // For now, just consume the 'rule' token and the next identifier, then skip to next newline or EOF\r\n        self.advance()?; // consume 'rule'\r\n        let name = if let Token::Identifier(ref s) = self.current_token {\r\n            s.clone()\r\n        } else {\r\n            return Err(ParserError::UnexpectedToken(self.current_token.clone()));\r\n        };\r\n        self.advance()?; // consume identifier\r\n        // Optionally parse parameters, block, etc.\r\n        // For now, skip to next newline or EOF\r\n        while self.current_token != Token::EOF \u0026\u0026 self.current_token != Token::Newline {\r\n            self.advance()?;\r\n        }\r\n        Ok(Stmt::ExprStmt(Expr::Identifier(format!(\"rule:{}\", name))))\r\n    }\r\n\r\n    fn parse_expression_statement(\u0026mut self) -\u003e Result\u003cStmt, ParserError\u003e {\r\n        let expr = self.parse_expression()?;\r\n        // Only advance if not at EOF or Newline (avoid advancing past end)\r\n        if self.current_token != Token::EOF \u0026\u0026 self.current_token != Token::Newline {\r\n            self.advance()?;\r\n        }\r\n        Ok(Stmt::ExprStmt(expr))\r\n    }\r\n\r\n    fn parse_expression(\u0026mut self) -\u003e Result\u003cExpr, ParserError\u003e {\r\n        self.parse_binary_expression(0)\r\n    }\r\n\r\n    // Operator precedence: * / \u003e + -\r\n    fn get_precedence(token: \u0026Token) -\u003e u8 {\r\n        match token {\r\n            Token::Star | Token::Slash | Token::Percent =\u003e 4,\r\n            Token::Plus | Token::Minus =\u003e 3,\r\n            Token::Greater | Token::GreaterEqual | Token::Less | Token::LessEqual =\u003e 2,\r\n            Token::Identifier(id) if id == \"and\" =\u003e 1,\r\n            Token::Identifier(id) if id == \"or\" =\u003e 1,\r\n            _ =\u003e 0,\r\n        }\r\n    }\r\n\r\n    fn parse_binary_expression(\u0026mut self, min_prec: u8) -\u003e Result\u003cExpr, ParserError\u003e {\r\n        let mut left = self.parse_primary()?;\r\n\r\n        println!(\r\n            \"[DEBUG][parse_binary_expression] Start: min_prec = {}, left = {:?}, current_token = {:?}\",\r\n            min_prec, left, self.current_token\r\n        );\r\n\r\n        loop {\r\n            let prec = Self::get_precedence(\u0026self.current_token);\r\n            println!(\r\n                \"[DEBUG][parse_binary_expression] Loop: min_prec = {}, token = {:?}, prec = {}\",\r\n                min_prec, self.current_token, prec\r\n            );\r\n            if prec \u003c min_prec || prec == 0 {\r\n                println!(\r\n                    \"[DEBUG][parse_binary_expression] Breaking: prec \u003c min_prec or prec == 0 (prec = {}, min_prec = {})\",\r\n                    prec, min_prec\r\n                );\r\n                break;\r\n            }\r\n\r\n            let op_token = self.current_token.clone();\r\n            self.advance()?;\r\n\r\n            println!(\r\n                \"[DEBUG][parse_binary_expression] Parsing right side: op_token = {:?}, next_token = {:?}, next_prec = {}\",\r\n                op_token, self.current_token, Self::get_precedence(\u0026self.current_token)\r\n            );\r\n\r\n            let mut right = self.parse_binary_expression(prec + 1)?;\r\n\r\n            println!(\r\n                \"[DEBUG][parse_binary_expression] Building BinaryOp: left = {:?}, op_token = {:?}, right = {:?}\",\r\n                left, op_token, right\r\n            );\r\n\r\n            let op = match op_token {\r\n                Token::Plus =\u003e ast::BinaryOperator::Add,\r\n                Token::Minus =\u003e ast::BinaryOperator::Sub,\r\n                Token::Star =\u003e ast::BinaryOperator::Mul,\r\n                Token::Slash =\u003e ast::BinaryOperator::Div,\r\n                Token::Percent =\u003e ast::BinaryOperator::Mod,\r\n                Token::Greater =\u003e ast::BinaryOperator::Greater,\r\n                Token::GreaterEqual =\u003e ast::BinaryOperator::GreaterEqual,\r\n                Token::Less =\u003e ast::BinaryOperator::Less,\r\n                Token::LessEqual =\u003e ast::BinaryOperator::LessEqual,\r\n                Token::Identifier(id) if id == \"and\" =\u003e ast::BinaryOperator::And,\r\n                Token::Identifier(id) if id == \"or\" =\u003e ast::BinaryOperator::Or,\r\n                _ =\u003e return Err(ParserError::UnexpectedToken(op_token)),\r\n            };\r\n\r\n            left = Expr::BinaryOp {\r\n                left: Box::new(left),\r\n                op,\r\n                right: Box::new(right),\r\n            };\r\n            println!(\r\n                \"[DEBUG][parse_binary_expression] Updated left: {:?}\",\r\n                left\r\n            );\r\n        }\r\n\r\n        println!(\r\n            \"[DEBUG][parse_binary_expression] Returning: {:?}\",\r\n            left\r\n        );\r\n        Ok(left)\r\n    }\r\n\r\n    fn parse_primary(\u0026mut self) -\u003e Result\u003cExpr, ParserError\u003e {\r\n        let token = self.current_token.clone();\r\n        match token {\r\n            Token::Number(n) =\u003e {\r\n                let expr = Expr::Number(n);\r\n                self.advance()?;\r\n                Ok(expr)\r\n            }\r\n            Token::String(s) =\u003e {\r\n                let expr = Expr::String(s);\r\n                self.advance()?;\r\n                Ok(expr)\r\n            }\r\n            Token::Identifier(ref id) if id == \"not\" =\u003e {\r\n                self.advance()?;\r\n                let expr = self.parse_primary()?;\r\n                Ok(Expr::UnaryOp {\r\n                    op: \"not\".to_string(),\r\n                    expr: Box::new(expr),\r\n                })\r\n            }\r\n            Token::Identifier(ref id) =\u003e {\r\n                // Treat \"true\" and \"false\" as boolean literals, else identifier or function call\r\n                let ident_expr = match id.as_str() {\r\n                    \"true\" =\u003e Expr::Identifier(\"true\".to_string()),\r\n                    \"false\" =\u003e Expr::Identifier(\"false\".to_string()),\r\n                    _ =\u003e Expr::Identifier(id.clone()),\r\n                };\r\n                self.advance()?;\r\n                // Check for function call: identifier followed by '('\r\n                if self.current_token == Token::LParen {\r\n                    self.advance()?;\r\n                    let mut args = Vec::new();\r\n                    if self.current_token != Token::RParen {\r\n                        loop {\r\n                            // Parse a full expression as ion Traits ====\r\n// =========================\r\n\r\n/// Trait for custom security policies (authentication \u0026 authorization).\r\npub trait SecurityPolicy: Send + Sync {\r\n    /// Authenticate a node with credentials.\r\n    fn authenticate(\u0026self, node_id: \u0026str, credentials: \u0026[u8]) -\u003e Result\u003cbool, crate::error_handler::RuntimeError\u003e;\r\n    /// Authorize an action for a subject.\r\n    fn authorize(\u0026self, subject: \u0026str, action: \u0026str, resource: \u0026str) -\u003e Result\u003cbool, crate::error_handler::RuntimeError\u003e;\r\n}\r\n\r\n/// Trait for custom distributed protocol integration.\r\npub trait DistributedProtocol: Send + Sync {\r\n    /// Deploy code to nodes using a custom protocol.\r\n    fn deploy(\u0026self, code_package: \u0026[u8], target_nodes: \u0026[String]) -\u003e Result\u003c(), crate::error_handler::RuntimeError\u003e;\r\n    /// Execute code remotely using a custom protocol.\r\n    fn execute(\u0026self, node_id: \u0026str, payload: \u0026[u8]) -\u003e Result\u003cVec\u003cu8\u003e, crate::error_handler::RuntimeError\u003e;\r\n}\r\n\r\n/// Trait for custom sandbox models.\r\n/// Now dyn-compatible (object-safe).\r\npub trait SandboxModel: Send + Sync {\r\n    // Add object-safe methods here as needed.\r\n}\r\n\r\n// =========================\r\n// === Core Functions    ===\r\n// =========================\r\n\r\n/// Deploys code securely to the distributed system using a pluggable protocol.\r\n///\r\n/// # Extensibility\r\n/// - Pass a custom `DistributedProtocol` for protocol integration.\r\n/// - Use `SecurityPolicy` for pre-deployment validation.\r\npub fn deploy_code(\r\n    code_package: \u0026[u8],\r\n    target_nodes: \u0026[String],\r\n    protocol: \u0026dyn DistributedProtocol,\r\n    security_policy: Option\u003c\u0026dyn SecurityPolicy\u003e,\r\n    custom_error_handler: Option\u003c\u0026dyn crate::error_handler::ErrorHandler\u003e,\r\n) -\u003e Result\u003c(), crate::error_handler::RuntimeError\u003e {\r\n    audit_log(\"deploy\", \"Code deployment initiated\");\r\n    let event = crate::event_system::Event {\r\n        event_type: \"deploy\".to_string(),\r\n        payload: format!(\"Deploying code to nodes: {:?}\", target_nodes),\r\n    };\r\n    on_event(\u0026event);\r\n\r\n    // Optional: Security policy validation\r\n    if let Some(policy) = security_policy {\r\n        for node in target_nodes {\r\n            let auth = policy.authenticate(node, b\"default\");\r\n            if let Err(e) = auth {\r\n                audit_log(\"error\", \u0026format!(\"Security policy error: {}\", e.message));\r\n                return Err(e);\r\n            }\r\n        }\r\n    }\r\n\r\n    // Use custom protocol for deployment\r\n    let result = protocol.deploy(code_package, target_nodes);\r\n    if let Err(ref error) = result {\r\n        audit_log(\"error\", \u0026format!(\"Deployment error: {}\", error.message));\r\n        let error_event = crate::event_system::Event {\r\n            event_type: \"error\".to_string(),\r\n            payload: format!(\"Deployment error: {}\", error.message),\r\n        };\r\n        on_event(\u0026error_event);\r\n        if let Some(handler) = custom_error_handler {\r\n            handler.handle(error);\r\n        }\r\n        crate::error_handler::report_error(error.clone());\r\n    }\r\n    result\r\n}\r\n\r\n/// Executes code remotely on a specified node using a pluggable protocol.\r\n///\r\n/// # Extensibility\r\n/// - Pass a custom `DistributedProtocol` for protocol integration.\r\n/// - Use `SecurityPolicy` for pre-execution authorization.\r\npub fn execute_remote(\r\n    node_id: \u0026str,\r\n    payload: \u0026[u8],\r\n    protocol: \u0026dyn DistributedProtocol,\r\n    security_policy: Option\u003c\u0026dyn SecurityPolicy\u003e,\r\n    custom_error_handler: Option\u003c\u0026dyn crate::error_handler::ErrorHandler\u003e,\r\n) -\u003e Result\u003cVec\u003cu8\u003e, crate::error_handler::RuntimeError\u lue: Box\u003cdyn std::any::Any + Send + Sync\u003e,\r\n    pub ty: Type,\r\n}\r\n\r\n/// Trait for type system integration with other modules.\r\npub trait TypeSystemIntegration {\r\n    fn notify_type_event(\u0026self, event: TypeSystemEvent);\r\n}\r\n\r\n/// Events emitted by the type system for integration.\r\n#[derive(Debug)]\r\npub enum TypeSystemEvent {\r\n    TypeChecked { value: TypedValue },\r\n    TypeError { message: String },\r\n    InferencePerformed { value: TypedValue },\r\n}\r\n\r\n/// Public API for the Type System.\r\npub struct TypeSystem {\r\n    /// Registered custom types and rules.\r\n    custom_types: HashMap\u003cString, Type\u003e,\r\n    /// Integration hooks.\r\n    integrations: Vec\u003cBox\u003cdyn TypeSystemIntegration + Send + Sync\u003e\u003e,\r\n}\r\n\r\nimpl TypeSystem {\r\n    /// Create a new TypeSystem instance.\r\n    pub fn new() -\u003e Self {\r\n        Self {\r\n            custom_types: HashMap::new(),\r\n            integrations: Vec::new(),\r\n        }\r\n    }\r\n\r\n    pub fn custom_types(\u0026self) -\u003e \u0026HashMap\u003cString, Type\u003e {\r\n        \u0026self.custom_types\r\n    }\r\n\r\n    /// Register an integration hook (for Core Evaluator, Memory Manager, etc.).\r\n    pub fn register_integration\u003cT: TypeSystemIntegration + Send + Sync + 'static\u003e(\u0026mut self, integration: T) {\r\n        self.integrations.push(Box::new(integration));\r\n    }\r\n\r\n    /// Register a custom type.\r\n    pub fn register_custom_type(\u0026mut self, name: \u0026str) {\r\n        self.custom_types.insert(name.to_string(), Type::Custom(name.to_string()));\r\n    }\r\n\r\n    /// Basic type checking: checks if the value matches the expected type.\r\n    pub fn check_type(\u0026self, value: TypedValue, expected: \u0026Type) -\u003e Result\u003c(), String\u003e {\r\n        if \u0026value.ty == expected {\r\n            // Emit event with owned value, only notify first integration\r\n            self.emit_event(TypeSystemEvent::TypeChecked {\r\n                value,\r\n            });\r\n            Ok(())\r\n        } else {\r\n            let msg = format!(\"Type error: expected {:?}, got {:?}\", expected, value.ty);\r\n            self.emit_event(TypeSystemEvent::TypeError { message: msg.clone() });\r\n            Err(msg)\r\n        }\r\n    }\r\n\r\n    /// Basic type inference: infers the type from a value (stub logic).\r\n    pub fn infer_type(\u0026self, value: \u0026dyn std::any::Any) -\u003e Type {\r\n        // Stub: In a real implementation, this would inspect the value.\r\n        // Here, we just return Unknown.\r\n        Type::Unknown\r\n    }\r\n\r\n    /// Emit an event to all integrations.\r\n    fn emit_event(\u0026self, event: TypeSystemEvent) {\r\n        // Only notify the first integration for events containing TypedValue,\r\n        // since they cannot be cloned. For other events, notify all.\r\n        match \u0026event {\r\n            TypeSystemEvent::TypeChecked { .. } | TypeSystemEvent::InferencePerformed { .. } =\u003e {\r\n                if let Some(integration) = self.integrations.first() {\r\n                    integration.notify_type_event(event);\r\n                }\r\n            }\r\n            _ =\u003e {\r\n                for integration in \u0026self.integrations {\r\n                    integration.notify_type_event(TypeSystemEvent::TypeError {\r\n                        message: match \u0026event {\r\n                            TypeSystemEvent::TypeError { message } =\u003e message.clone(),\r\n                            _ =\u003e String::from(\"Unknown event\"),\r\n                        }\r\n                    });\r\n                }\r\n            }\r\n        }\r\n    }\r\n\r\n    /// Placeholder for constraint management API.\r\n    pub fn add_constraint(\u0026self, _constraint: \u0026str) {\r\n        // Stub for constraint management.\r\n    }\r\n}\r\n\r\n// --- Integration Stubs for Other Modules ---\r\n\r\n/// Goal) {\r\n        *self.pursued.lock().unwrap() = true;\r\n    }\r\n}\r\n\r\n\r\n#[test]\r\nfn test_goal_declaration_and_pursuit() {\r\n    let system = GoalSystem::new();\r\n    let listener = Arc::new(TestListener {\r\n        declared: Mutex::new(false),\r\n        pursued: Mutex::new(false),\r\n    });\r\n    system.register_listener(listener.clone());\r\n\r\n    let goal_id: GoalId = \"goal1\".to_string();\r\n    let description = \"Test goal\".to_string();\r\n\r\n    system.declare_goal(goal_id.clone(), description.clone());\r\n\r\n    assert_eq!(*listener.declared.lock().unwrap(), true);\r\n\r\n    system.pursue_goal(\u0026goal_id);\r\n\r\n    assert_eq!(*listener.pursued.lock().unwrap(), true);\r\n    // The public API sets status to Completed after pursuit, so check for Completed.\r\n    assert_eq!(system.get_goal_status(\u0026goal_id), Some(GoalStatus::Completed));\r\n}\r\n\r\n#[test]\r\nfn test_goal_status_transitions() {\r\n    let system = GoalSystem::new();\r\n    let goal_id: GoalId = \"goal2\".to_string();\r\n    let description = \"Another goal\".to_string();\r\n\r\n    system.declare_goal(goal_id.clone(), description);\r\n\r\n    // Move to Completed (pursue_goal sets to Completed)\r\n    system.pursue_goal(\u0026goal_id);\r\n    assert_eq!(\r\n        system.get_goal_status(\u0026goal_id),\r\n        Some(GoalStatus::Completed)\r\n    );\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","tests","inferencing_engine.rs"],"content":"//! Tests for InferencingEngine core module\r\n\r\nuse patlang_runtime::inferencing_engine::{InferencingEngine, Term, Goal};\r\n\r\n#[test]\r\nfn test_inferencing_engine_new() {\r\n    let engine = InferencingEngine::new();\r\n    assert!(engine.evaluator.is_none());\r\n    assert!(engine.goal_system.is_none());\r\n}\r\n\r\n#[test]\r\nfn test_unify_success_and_failure() {\r\n    let engine = InferencingEngine::new();\r\n    let a = Term::Int(1);\r\n    let b = Term::Int(1);\r\n    l  vec![0],\r\n    };\r\n    let msg2 = msg1.clone();\r\n    queue.send(msg1).await.unwrap();\r\n    // Fill the channel, then drop receiver to cause send error\r\n    drop(rx);\r\n    let result = queue.send(msg2).await;\r\n    assert!(result.is_err());\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","tests","object_model.rs"],"content":"//! Tests for ObjectModel core module\r\n\r\nuse patlang_runtime::object_model::{Object, Value, ObjectError};\r\n\r\nfn dummy_method(_obj: \u0026mut Object, args: Vec\u003cValue\u003e) -\u003e Result\u003cValue, ObjectError\u003e {\r\n    if let Some(Value::Int(x)) = args.get(0) {\r\n        Ok(Value::Int(x + 1))\r\n    } else {\r\n        Err(ObjectError { message: \"Invalid argument\".to_string() })\r\n    }\r\n}\r\n\r\n#[test]\r\nfn test_object_creation_and_properties() {\r\n    let mut obj = Object::new(\"TestClass\");\r\n    assert_eq!(obj.class_name, \"TestClass\");\r\n    obj.set_property(\"foo\", Value::Int(123));\r\n    if let Some(val) = obj.get_property(\"foo\") {\r\n        assert!(matches!(val, Value::Int(123)));\r\n    } else {\r\n        panic!(\"Property 'foo' not found\");\r\n    }\r\n    assert!(obj.get_property(\"bar\").is_none());\r\n}\r\n\r\n#[test]\r\nfn test_method_registration_and_call() {\r\n    let mut obj = Object::new(\"TestClass\");\r\n    obj.add_method(\"inc\", dummy_method);\r\n    let result = obj.call_method(\"inc\", vec![Value::Int(10)]).unwrap();\r\n    assert!(matches!(result, Value::Int(11)));\r\n}\r\n\r\n#[test]\r\nfn test_method_call_error() {\r\n    let mut obj = Object::new(\"TestClass\");\r\n    let err = obj.call_method(\"missing\", vec![]).unwrap_err();\r\n    assert!(err.message.contains(\"not found\") || err.message.contains(\"Missing\"));\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","tests","parser_tests.rs"],"content":"//! Tests for Patlang Rust parser and lexer\r\n\r\nuse patlang_runtime::lexer::{Lexe         var previousData = {"files":[{"path":["E:","\\","patlang","rust-runtime","src","arithmetic.rs"],"content":"//! Arithmetic Module Stub\r\n//! Handles arithmetic operations for the evaluator.\r\n\r\n#[derive(Debug, Clone)]\r\npub enum ArithmeticOp {\r\n    Add,\r\n    Sub,\r\n    Mul,\r\n    Div,\r\n    Mod,\r\n}\r\n\r\npub fn eval_arithmetic(op: ArithmeticOp, left: f64, right: f64) -\u003e f64 {\r\n    match op {\r\n        ArithmeticOp::Add =\u003e left + right,\r\n        ArithmeticOp::Sub =\u003e left - right,\r\n        ArithmeticOp::Mul =\u003e left * right,\r\n        ArithmeticOp::Div =\u003e left / right,\r\n        ArithmeticOp::Mod =\u003e left % right,\r\n    }\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","src","ast.rs"],"content":"//! Patlang AST definitions for Rust parser\r\n\r\n#[derive(Debug, Clone, PartialEq)]\r\npub enum Expr {\r\n    Number(f64),\r\n    String(String),\r\n    Identifier(String),\r\n    UnaryOp {\r\n        op: String,\r\n        expr: Box\u003cExpr\u003e,\r\n    },\r\n    BinaryOp {\r\n        left: Box\u003cExpr\u003e,\r\n        op: BinaryOperator,\r\n        right: Box\u003cExpr\u003e,\r\n    },\r\n    Call {\r\n        function: Box\u003cExpr\u003e,\r\n        args: Vec\u003cExpr\u003e,\r\n    },\r\n    // Extend with more expression types as needed\r\n}\r\n\r\n#[derive(Debug, Clone, PartialEq)]\r\npub enum Stmt {\r\n    ExprStmt(Expr),\r\n    Let {\r\n        name: String,\r\n        value: Expr,\r\n    },\r\n    Function {\r\n        name: String,\r\n        params: Vec\u003cString\u003e,\r\n        body: Vec\u003cStmt\u003e,\r\n    },\r\n    Return(Option\u003cExpr\u003e),\r\n    // Extend with more statement types as needed\r\n}\r\n\r\n#[derive(Debug, Clone, PartialEq)]\r\npub enum BinaryOperator {\r\n    Add,\r\n    Sub,\r\n    Mul,\r\n    Div,\r\n    Mod,\r\n    And,\r\n    Or,\r\n    Greater,\r\n    GreaterEqual,\r\n    Less,\r\n    LessEqual,\r\n    // Extend with more         right: Box\u003cAstNode\u003e,\r\n    },\r\n    StringOp {\r\n        op: crate::string::StringOp,\r\n        left: Box\u003cAstNode\u003e,\r\n        right: Option\u003cBox\u003cAstNode\u003e\u003e,\r\n    },\r\n    FunctionCall {\r\n        name: String,\r\n        args: Vec\u003cAstNode\u003e,\r\n    },\r\n    ObjectOp {\r\n        class_name: String,\r\n        // Extend as needed\r\n    },\r\n    ReasoningOp {\r\n        op: crate::reasoning::ReasoningOp,\r\n        input: Box\u003cAstNode\u003e,\r\n    },\r\n    // Add more as needed\r\n    Block(Vec\u003cAstNode\u003e),\r\n}\r\n\r\n#[derive(Debug, Clone)]\r\npub struct AstNode {\r\n    pub kind: AstKind,\r\n    pub children: Vec\u003cAstNode\u003e,\r\n    // Add fields as required for real AST\r\n}\r\n\r\n/// Execution context holding scope and environment information.\r\npub struct ExecutionContext {\r\n    // Add fields for variable scope, environment, etc.\r\n}\r\n\r\nimpl ExecutionContext {\r\n    /// Create a new execution context.\r\n    pub fn new() -\u003e Self {\r\n        ExecutionContext {\r\n            // Initialize fields\r\n        }\r\n    }\r\n}\r\n\r\n/// Core Evaluator responsible for traversing and executing AST nodes.\r\npub struct CoreEvaluator\u003c'a\u003e {\r\n    pub context: ExecutionContext,\r\n    pub event_listener: Option\u003c\u0026'a dyn EventListener\u003e,\r\n    pub message_consumer: Option\u003c\u0026'a dyn MessageConsumer\u003e,\r\n    pub error_handler: Option\u003c\u0026'a dyn ErrorHandler\u003e,\r\n    pub security_policy: Option\u003c\u0026'a dyn SecurityPolicy\u003e,\r\n    pub distributed_protocol: Option\u003c\u0026'a dyn DistributedProtocol\u003e,\r\n}\r\n\r\nimpl\u003c'a\u003e CoreEvaluator\u003c'a\u003e {\r\n    /// Create a new CoreEvaluator with optional integrations.\r\n    pub fn new(\r\n        event_listener: Option\u003c\u0026'a dyn EventListener\u003e,\r\n        message_consumer: Option\u003c\u0026'a dyn MessageConsumer\u003e,\r\n        error_handler: Option\u003c\u0026'a dyn ErrorHandler\u003e,\r\n        security_policy: Option\u003c\u0026'a dyn SecurityPolicy\u003e,\r\n        distributed_protocol: Option\u003c\u0026'a dyn DistributedProtocol\u003e,\r\n    ) -\u003e Self {\r\n        CoreEvaluator {\r\n            context: ExecutionContext::new(),\r\n            event_listener,\r\n            message_consumer,\r\n            error_handler,\r\n            security_policy,\r\n            distributed_protocol,\r\n        }\r\n    }\r\n\r\n    /// Traverse the AST and delegate execution.\r\n    pub fn traverse_and_execute(\u0026mut self, node: \u0026AstNode) -\u003e Result\u003cString, RuntimeError\u003e {\r\n        // Example event integration\r\n        if let Some(listener) = self.event_listener {\r\n            let event = Event { event_type: \"...\".to_string(), payload: \"...\".to_string() };\r\n            listener.on_event(\u0026event);\r\n        }\r\n\r\n        // Example security integration\r\n        if let Some(policy) = self.security_policy {\r\n            // policy.enforce(\u0026self.context, node); // Uncomment when implemented\r\n        }\r\n\r\n        // Basic traversal logic (stub)\r\n        self.execute_node(node)\r\n    }\r\n\r\n    /// Execute a single AST node (stub).\r\n    pub fn execute_node(\u0026mut self, node: \u0026AstNode) -\u003e Result\u003cString, RuntimeError\u003e {\r\n        use crate::arithmetic::{eval_arithmetic, ArithmeticOp};\r\n        use crate::string::{eval_string, StringOp};\r\n\r\n        // TEMP DEBUG: Log each node as it is evaluated\r\n        println!(\"[DEBUG] Evaluating node: {:?}\", node.kind);\r\n\r\n        match \u0026node.kind {\r\n            AstKind::Number(n) =\u003e {\r\n                Ok(n.to_string())\r\n            }\r\n            AstKind::String(s) =\u003e {\r\n                Ok(s.clone())\r\n            }\r\n            AstKind::Identifier(id) if id == \"true\" =\u003e {\r\n                Ok(\"true\".to_string())\r\n            }\r\n            AstKind::Identifier(id) if id == \"false\" =\u003e {\r\n                Ok(\"false\".to_string())\r\n            }\r\n            AstKind::Identifier(id) if id.starts_with(\"unary:not\") =\u003e {\r\n                // crude unary not handler for debugging\r\n                if id.contains(\"true\") {\r\n                    Ok(\"false\".to_string())\r\n                } else if id.contains(\"false\") {\r\n                    Ok(\"true\".to_string())\r\n                } else {\r\n                    Ok(format!(\"not({})\", id))\r\n                }\r\n            }\r\n            AstKind::Print(expr) =\u003e {\r\n                // Evaluate the expression and return its string representation\r\n                let val = self.execute_node(expr)?;\r\n                println!(\"[DEBUG][evaluator] Print node evaluated to: {:?}\", val);\r\n                println!(\"[DEBUG][evaluator] Print node inner AST: {:?}\", expr.kind);\r\n                Ok(val)\r\n            }\r\n            AstKind::BinaryOp { op, left, right } =\u003e {\r\n                // Recursively evaluate left and right operands\r\n                let left_str = self.execute_node(left)?;\r\n                let right_str = self.execute_node(right)?;\r\n\r\n                // Debug logs for operand values\r\n                println!(\"[DEBUG][evaluator] BinaryOp left evaluated to: {:?}\", left_str);\r\n                println!(\"[DEBUG][evaluator] BinaryOp right evaluated to: {:?}\", right_str);\r\n\r\n                // Try to parse as f64 for arithmetic/logical/comparison\r\n                let left_val = left_str.parse::\u003cf64\u003e().ok();\r\n                let right_val = right_str.parse::\u003cf64\u003e().ok();\r\n\r\n                match op {\r\n                    crate::ast::BinaryOpKind::Arithmetic(binop) =\u003e {\r\n                        use crate::arithmetic::{eval_arithmetic, ArithmeticOp};\r\n                        let l = left_val.unwrap_or(0.0);\r\n                        let r = right_val.unwrap_or(0.0);\r\n                        let result = match binop {\r\n                            crate::ast::BinaryOperator::Add =\u003e eval_arithmetic(ArithmeticOp::Add, l, r),\r\n                            crate::ast::BinaryOperator::Sub =\u003e eval_arithmetic(ArithmeticOp::Sub, l, r),\r\n                            crate::ast::BinaryOperator::Mul =\u003e eval_arithmetic(ArithmeticOp::Mul, l, r),\r\n                            crate::ast::BinaryOperator::Div =\u003e eval_arithmetic(ArithmeticOp::Div, l, r),\r\n                            crate::ast::BinaryOperator::Mod =\u003e eval_arithmetic(ArithmeticOp::Mod, l, r),\r\n                            _ =\u003e 0.0,\r\n                        };\r\n                        Ok(result.to_string())\r\n                    }\r\n                    crate::ast::BinaryOpKind::Logical(binop) =\u003e {\r\n                        let l = left_val.unwrap_or(0.0);\r\n                        let r = right_val.unwrap_or(0.0);\r\n                        let b = match binop {\r\n                            crate::ast::BinaryOperator::And =\u003e l != 0.0 \u0026\u0026 r != 0.0,\r\n                            crate::ast::BinaryOperator::Or =\u003e l != 0.0 || r != 0.0,\r\n                            _ =\u003e false,\r\n                        };\r\n                        Ok(if b { \"true\".to_string() } else { \"false\".to_string() })\r\n                    }\r\n                    crate::ast::BinaryOpKind::Comparison(binop) =\u003e {\r\n                        let l = left_val.unwrap_or(0.0);\r\n                        let r = right_val.unwrap_or(0.0);\r\n                        let b = match binop {\r\n                            crate::ast::BinaryOperator::Greater =\u003e l \u003e r,\r\n                            crate::ast::BinaryOperator::GreaterEqual =\u003e l \u003e= r,\r\n                            crate::ast::BinaryOperator::Less =\u003e l \u003c r,\r\n                            crate::ast::BinaryOperator::LessEqual =\u003e l \u003c= r,\r\n                            _ =\u003e false,\r\n                        };\r\n                        Ok(if b { \"true\".to_string() } else { \"false\".to_string() })\r\n                    }\r\n                }\r\n            }\r\n            AstKind::StringOp { op, left, right } =\u003e {\r\n                let left_val = if let AstKind::String(ref s) = left.kind { s } else { \"\" };\r\n                let right_val = right.as_ref().and_then(|n| if let AstKind::String(ref s) = n.kind { Some(s.as_str()) } else { None });\r\n                let result = eval_string(op.clone(), left_val, right_val);\r\n                Ok(result)\r\n            }\r\n            AstKind::Block(stmts) =\u003e {\r\n                let mut last = String::new();\r\n                for stmt in stmts {\r\n                    last = self.execute_node(stmt)?;\r\n                }\r\n                Ok(last)\r\n            }\r\n            _ =\u003e {\r\n                // Recursively execute children\r\n                let mut last = String::new();\r\n                for child in \u0026node.children {\r\n                    last = self.execute_node(child)?;\r\n                }\r\n                Ok(last)\r\n            }\r\n        }\r\n    }\r\n\r\n    /// Manage context and scope (stub).\r\n    pub fn enter_scope(\u0026mut self) {\r\n        // Push new scope\r\n    }\r\n\r\n    pub fn exit_scope(\u0026mut self) {\r\n        // Pop scope\r\n    }\r\n}\r\n\r\n// Simple result and error types for evaluation\r\npub struct EvalResult {\r\n    pub message: String,\r\n}\r\n\r\npub struct EvalError {\r\n    pub message: String,\r\n}\r\n\r\n/// Evaluate Patlang source code string.\r\n/// This stub \"parses\" the source into a dummy AST node and evaluates it.\r\npub fn evaluate_patlang_source(source: \u0026str) -\u003e Result\u003cEvalResult, EvalError\u003e {\r\n    use crate::parser::Parser;\r\n    use crate::ast::{Stmt, Expr};\r\n    // Parse the source into statements\r\n    let mut parser = Parser::new(source).map_err(|e| EvalError { message: format!(\"Parse error: {:?}\", e) })?;\r\n    let stmts = parser.parse().map_err(|e| EvalError { message: format!(\"Parse error: {:?}\", e) })?;\r\n    println!(\"[DEBUG] Parsed statements: {:#?}\", stmts);\r\n    // Only collect output for print statements\r\n    let mut results = Vec::new();\r\n    for stmt in \u0026stmts {\r\n        if let Stmt::ExprStmt(Expr::Call { function, args }) = stmt {\r\n            println!(\"[DEBUG] Found ExprStmt::Call: function={:?}, args={:?}\", function, args);\r\n            if let Expr::Identifier(name) = \u0026**function {\r\n                println!(\"[DEBUG] Call function identifier: {}\", name);\r\n                if name == \"print\" {\r\n                    let ast = stmt_to_astnode(stmt);\r\n                    match evaluate_ast(\u0026ast, None, None, None, None, None) {\r\n                        Ok(val) =\u003e results.push(val),\r\n                        Err(e) =\u003e return Err(EvalError { message: format!(\"Evaluation failed: {}\", e) }),\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    }\r\n    Ok(EvalResult {\r\n        message: if results.is_empty() {\r\n            String::from(\"\")\r\n        } else {\r\n            results.join(\"\\n\")\r\n        },\r\n    })\r\n}\r\n// Helper: Convert Stmt to AstNode (minimal stub)\r\nfn stmt_to_astnode(stmt: \u0026crate::ast::Stmt) -\u003e AstNode {\r\n    match stmt {\r\n        crate::ast::Stmt::ExprStmt(expr) =\u003e AstNode::from(expr.clone()),\r\n        // Extend for other Stmt variants as needed\r\n        _ =\u003e AstNode {\r\n            kind: AstKind::Block(vec![]),\r\n            children: vec![],\r\n        },\r\n    }\r\n}\r\n\r\n// Helper: Convert Expr to AstKind (minimal stub)\r\nfn expr_to_astkind(expr: \u0026crate::ast::Expr) -\u003e AstKind {\r\n    match expr {\r\n        crate::ast::Expr::Number(n) =\u003e AstKind::Number(*n),\r\n        crate::ast::Expr::String(s) =\u003e AstKind::String(s.clone()),\r\n        crate::ast::Expr::Call { function, args } =\u003e {\r\n            println!(\"[DEBUG] Expr::Call detected: function={:?}, args={:?}\", function, args);\r\n            // Detect print calls: function is identifier \"print\" and one argument\r\n            if let crate::ast::Expr::Identifier(name) = \u0026**function {\r\n                println!(\"[DEBUG] Expr::Call function identifier: {}\", name);\r\n                if name == \"print\" \u0026\u0026 args.len() == 1 {\r\n                    let arg_node = AstNode {\r\n                        kind: expr_to_astkind(\u0026args[0]),\r\n                        children: vec![],\r\n                    };\r\n                    println!(\"[DEBUG] Matched print call, converting to AstKind::Print\");\r\n                    return AstKind::Print(Box::new(arg_node));\r\n                }\r\n            }\r\n            AstKind::Block(vec![]) // fallback for other calls\r\n        }\r\n        _ =\u003e AstKind::Block(vec![]),\r\n    }\r\n}\r\n\r\n// Public API stubs for module consumers\r\n\r\n/// Traverse and execute an AST using the core evaluator.\r\npub fn evaluate_ast(\r\n    root: \u0026AstNode,\r\n    event_listener: Option\u003c\u0026dyn EventListener\u003e,\r\n    message_consumer: Option\u003c\u0026dyn MessageConsumer\u003e,\r\n    error_handler: Option\u003c\u0026dyn ErrorHandler\u003e,\r\n    security_policy: Option\u003c\u0026dyn SecurityPolicy\u003e,\r\n    distributed_protocol: Option\u003c\u0026dyn DistributedProtocol\u003e,\r\n) -\u003e Result\u003cString, RuntimeError\u003e {\r\n    let mut evaluator = CoreEvaluator::new(\r\n        event_listener,\r\n        message_consumer,\r\n        error_handler,\r\n        security_policy,\r\n        distributed_protocol,\r\n    );\r\n    evaluator.traverse_and_execute(root)\r\n}","traces":[{"line":94,"address":[],"length":0,"stats":{"Line":0}},{"line":104,"address":[],"leng nts the error message.\r\npub fn report_error(err: RuntimeError) {\r\n    println!(\"Runtime error reported: {:?}\", err);\r\n}\r\n\r\nimpl RuntimeError {\r\n    /// Create a new runtime error.\r\n    pub fn new(kind: RuntimeErrorKind, message: impl Into\u003cString\u003e) -\u003e Self {\r\n        RuntimeError {\r\n            kind,\r\n            message: message.into(),\r\n            source: None,\r\n        }\r\n    }\r\n\r\n    /// Propagate an error by wrapping it as the source.\r\n    pub fn propagate(kind: RuntimeErrorKind, message: impl Into\u003cString\u003e, source: RuntimeError) -\u003e Self {\r\n        RuntimeError {\r\n            kind,\r\n            message: message.into(),\r\n            source: Some(Arc::new(source)),\r\n        }\r\n    }\r\n\r\n    /// Emit an error event (stub).\r\n    pub fn emit_event(\u0026self) {\r\n        // Integrate with EventSystem here.\r\n        // Example: EventSystem::emit(Event::Error(self.clone()));\r\n        // Stub for now.\r\n    }\r\n}\r\n\r\nimpl fmt::Display for RuntimeError {\r\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\r\n        write!(f, \"[{:?}] {}\", self.kind, self.message)\r\n    }\r\n}\r\n\r\nimpl std::error::Error for RuntimeError {}\r\n\r\n/// Trait for extensible error handlers.\r\npub trait ErrorHandler: Send + Sync {\r\n    /// Handle a runtime error.\r\n    fn handle(\u0026self, error: \u0026RuntimeError);\r\n}\r\n\r\n/// Default error handler (stub).\r\npub struct DefaultErrorHandler;\r\n\r\nimpl ErrorHandler for DefaultErrorHandler {\r\n    fn handle(\u0026self, error: \u0026RuntimeError) {\r\n        // Basic logic: print and emit event.\r\n        eprintln!(\"{}\", error);\r\n        error.emit_event();\r\n    }\r\n}\r\n\r\n// Integration stubs for other modules.\r\n// These would be replaced with actual imports and usage in real integration.\r\n\r\npub mod integration {\r\n    use super::RuntimeError;\r\n\r\n    pub trait CoreEvaluatorError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n    pub trait MemoryManagerError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n    pub trait GoalSystemError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n    pub trait TypeSystemError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n    pub trait InferencingEngineError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n    pub trait ScopeManagerError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n    pub trait ObjectModelError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n    pub trait EventSystemError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n    pub trait MessageQueueError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n    pub trait SecureDistributedCodeError {\r\n        fn on_error(\u0026self, error: \u0026RuntimeError);\r\n    }\r\n}","traces":[{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":65,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":5},{"path":["E:","\\","patlang","rust-runtime","src","event_system.rs"],"content":"//! Event system traits and types.\r\n\r\n/// Represents a listener for events within the runtime.\r\n///\r\n/// Implementors of this trait can receive notifications when events occur.\r\npub trait EventListener {\r\n/// Called when an event is dispatched.\r\n///\r\n/// # Arguments\r\n///\r\n/// * event - Reference to the event that was triggered.\r\nfn on_event(\u0026self, event: \u0026Event);\r\n}\r\n\r\n/// Event struct with required fields for integration.\r\n#[derive(Debug, Clone)]\r\npub struct Event {\r\npub event_type: String,\r\npub payload: String,\r\n}\r\n\r\n/// Minimal public EventSystem struct for integration.\r\n#[derive(Default)]\r\npub struct EventSystem {\r\n    handlers: Vec\u003cBox\u003cdyn EventListener\u003e\u003e,\r\n}\r\n\r\nimpl EventSystem {\r\n    /// Creates a new EventSystem instance.\r\n    pub fn new() -\u003e Self {\r\n        EventSystem {\r\n            handlers: Vec::new(),\r\n        }\r\n    }\r\n\r\n    /// Registers an event handler.\r\n    pub fn register_handler(\u0026mut self, handler: Box\u003cdyn EventListener\u003e) {\r\n        self.handlers.push(handler);\r\n    }\r\n\r\n    /// Emits an event to all registered handlers.\r\n    pub fn emit(\u0026self, event: \u0026Event) {\r\n        for handler in \u0026self.handlers {\r\n            handler.on_event(event);\r\n        }\r\n    }\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","src","function.rs"],"content":"//! Function Module Stub\r\n//! Handles function definition and invocation for the evaluator.\r\n\r\n#[derive(Debug, Clone)]\r\npub struct FunctionDef {\r\n    pub name: String,\r\n    pub params: Vec\u003cString\u003e,\r\n    // Add more fields as needed\r\n}\r\n\r\npub fn call_function(def: \u0026FunctionDef, args: Vec\u003cString\u003e) -\u003e String {\r\n    // Stub: Replace with real function invocation logic\r\n    format!(\"Called function {} with args {:?}\", def.name, args)\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","src","goal_system.rs"],"content":"//! Goal System Module\r\n//!\r\n//! Responsibilities:\r\n//! - Declarative goal management (define, track, pursue goals)\r\n//! - Extensible for concurrent/distributed execution (stubbed)\r\n//! - Event-driven extensibility (event hooks, listeners)\r\n//! - Integration points: Core Evaluator, Memory Manager, Event System, Message Queue, Error Handler, Secure Distributed Code Support\r\n//!\r\n//! Extensibility Points:\r\n//! - Event hooks for goal lifecycle\r\n//! - Pluggable execution strategies (concurrent/distributed)\r\n//! - Integration traits for other core modules\r\n\r\nuse std::collections::HashMap;\r\nuse std::sync::{Arc, Mutex};\r\n\r\n/// Represents a unique identifier for a goal.\r\npub type GoalId = String;\r\n\r\n/// Enum representing the status of a goal.\r\n#[derive(Debug, Clone, PartialEq, Eq)]\r\npub enum GoalStatus {\r\n    Pending,\r\n    InProgress,\r\n    Completed,\r\n    Failed,\r\n}\r\n\r\n/// Struct representing a declarative goal.\r\n#[derive(Debug, Clone)]\r\npub struct Goal {\r\n    pub id: GoalId,\r\n    pub description: String,\r\n    pub status: GoalStatus,\r\n    // Additional metadata can be added here.\r\n}\r\n\r\n/// Trait for event-driven extensibility.\r\npub trait GoalEventListener: Send + Sync {\r\n    fn on_goal_declared(\u0026self, goal: \u0026Goal) {}\r\n    fn on_goal_pursued(\u0026self, goal: \u0026Goal) {}\r\n    fn on_goal_completed(\u0026self, goal: \u0026Goal) {}\r\n    fn on_goal_failed(\u0026self, goal: \u0026Goal) {}\r\n}\r\n\r\n/// Stub traits for integration with other modules.\r\npub trait CoreEvaluatorIntegration: Send + Sync {}\r\npub trait MemoryManagerIntegration: Send + Sync {}\r\npub trait EventSystemIntegration: Send + Sync {}\r\npub trait MessageQueueIntegration: Send + Sync {}\r\npub trait ErrorHandlerIntegration: Send + Sync {}\r\npub trait SecureDistributedCodeSupportIntegration: Send + Sync {}\r\n\r\n/// Main Goal System struct.\r\npub struct GoalSystem {\r\n    goals: Mutex\u003cHashMap\u003cGoalId, Goal\u003e\u003e,\r\n    listeners: Mutex\u003cVec\u003cArc\u003cdyn GoalEventListener\u003e\u003e\u003e,\r\n    // Integration fields (stubs)\r\n    pub core_evaluator: Option\u003cArc\u003cdyn CoreEvaluatorIntegration\u003e\u003e,\r\n    pub memory_manager: Option\u003cArc\u003cdyn MemoryManagerIntegration\u003e\u003e,\r\n    pub event_system: Option\u003cArc\u003cdyn EventSystemIntegration\u003e\u003e,\r\n    pub message_queue: Option\u003cArc\u003cdyn MessageQueueIntegration\u003e\u003e,\r\n    pub error_handler: Option\u003cArc\u003cdyn ErrorHandlerIntegration\u003e\u003e,\r\n    pub secure_distributed: Option\u003cArc\u003cdyn SecureDistributedCodeSupportIntegration\u003e\u003e,\r\n}\r\n\r\nimpl GoalSystem {\r\n    /// Create a new GoalSystem.\r\n    pub fn new() -\u003e Self {\r\n        Self {\r\n            goals: Mutex::new(HashMap::new()),\r\n            listeners: Mutex::new(Vec::new()),\r\n            core_evaluator: None,\r\n            memory_manager: None,\r\n            event_system: None,\r\n            message_queue: None,\r\n            error_handler: None,\r\n            secure_distributed: None,\r\n        }\r\n    }\r\n\r\n    /// Register an event listener for goal lifecycle events.\r\n    pub fn register_listener(\u0026self, listener: Arc\u003cdyn GoalEventListener\u003e) {\r\n        self.listeners.lock().unwrap().push(listener);\r\n    }\r\n\r\n    /// Declare a new goal.\r\n    pub fn declare_goal(\u0026self, id: GoalId, description: String) {\r\n        let goal = Goal {\r\n            id: id.clone(),\r\n            description,\r\n            status: GoalStatus::Pending,\r\n        };\r\n        self.goals.lock().unwrap().insert(id.clone(), goal.clone());\r\n        for listener in self.listeners.lock().unwrap().iter() {\r\n            listener.on_goal_declared(\u0026goal);\r\n        }\r\n    }\r\n\r\n    /// Pursue a goal by id (basic logic, no concurrency/distributed yet).\r\n    pub fn pursue_goal(\u0026self, id: \u0026GoalId) {\r\n        let mut goals = self.goals.lock().unwrap();\r\n        if let Some(goal) = goals.get_mut(id) {\r\n            goal.status = GoalStatus::InProgress;\r\n            for listener in self.listeners.lock().unwrap().iter() {\r\n                listener.on_goal_pursued(goal);\r\n            }\r\n            // Placeholder for actual pursuit logic.\r\n            // Simulate completion for now.\r\n            goal.status = GoalStatus::Completed;\r\n            for listener in self.listeners.lock().unwrap().iter() {\r\n                listener.on_goal_completed(goal);\r\n            }\r\n        }\r\n    }\r\n\r\n    /// Get the status of a goal.\r\n    pub fn get_goal_status(\u0026self, id: \u0026GoalId) -\u003e Option\u003cGoalStatus\u003e {\r\n        self.goals.lock().unwrap().get(id).map(|g| g.status.clone())\r\n    }\r\n\r\n    /// List all goals.\r\n    pub fn list_goals(\u0026self) -\u003e Vec\u003cGoal\u003e {\r\n        self.goals.lock().unwrap().values().cloned().collect()\r\n    }\r\n\r\n    // Extensibility: Add methods for concurrent/distributed execution here.\r\n    // (Stubbed for now)\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","src","inferencing_engine.rs"],"content":"//! Inferencing Engine Module\r\n//!\r\n//! Responsibilities:\r\n//! - Provides logical inference and unification capabilities.\r\n//! - Supports distributed reasoning (stubbed for future extension).\r\n//! - Integrates with core runtime modules: Core Evaluator, Memory Manager, Goal System, Type System, Event System, Message Queue, Error Handler, Secure Distributed Code Support.\r\n//! - Designed for extensibility: new inference strategies, distributed protocols, and custom logic can be added via traits and extension points.\r\n\r\n/// Public API for the Inferencing Engine.\r\npub struct InferencingEngine {\r\n    // Integration handles (stubs for now)\r\n    pub evaluator: Option\u003cBox\u003cdyn CoreEvaluator\u003e\u003e,\r\n    pub memory_manager: Option\u003cBox\u003cdyn MemoryManager\u003e\u003e,\r\n    pub goal_system: Option\u003cBox\u003cdyn GoalSystem\u003e\u003e,\r\n    pub type_system: Option\u003cBox\u003cdyn TypeSystem\u003e\u003e,\r\n    pub event_system: Option\u003cBox\u003cdyn EventSystem\u003e\u003e,\r\n    pub message_queue: Option\u003cBox\u003cdyn MessageQueue\u003e\u003e,\r\n    pub error_handler: Option\u003cBox\u003cdyn ErrorHandler\u003e\u003e,\r\n    pub secure_code_support: Option\u003cBox\u003cdyn SecureDistributedCodeSupport\u003e\u003e,\r\n}\r\n\r\nimpl InferencingEngine {\r\n    /// Create a new Inferencing Engine with optional integrations.\r\n    pub fn new() -\u003e Self {\r\n        Self {\r\n            evaluator: None,\r\n            memory_manager: None,\r\n            goal_system: None,\r\n            type_system: None,\r\n            event_system: None,\r\n            message_queue: None,\r\n            error_handler: None,\r\n            secure_code_support: None,\r\n        }\r\n    }\r\n\r\n    /// Perform logical inference on a given goal.\r\n    pub fn infer(\u0026self, goal: \u0026Goal) -\u003e InferenceResult {\r\n        // Basic logic: delegate to goal system and evaluator if present.\r\n        if let (Some(goal_sys), Some(eval)) = (\u0026self.goal_system, \u0026self.evaluator) {\r\n            let plan = goal_sys.plan(goal);\r\n            eval.evaluate(plan)\r\n        } else {\r\n            InferenceResult::error(\"Integration missing\")\r\n        }\r\n    }\r\n\r\n    /// Attempt to unify two terms.\r\n    pub fn unify(\u0026self, a: \u0026Term, b: \u0026Term) -\u003e UnificationResult {\r\n        // Basic logic: structural equality for now.\r\n        if a == b {\r\n            UnificationResult::success()\r\n        } else {\r\n            UnificationResult::failure()\r\n        }\r\n    }\r\n\r\n    /// Distributed reasoning API stub.\r\n    pub fn distributed_reason(\u0026self, _goal: \u0026Goal) -\u003e DistributedReasoningResult {\r\n        // Not implemented yet.\r\n        DistributedReasoningResult::not_implemented()\r\n    }\r\n\r\n    /// Extensibility: register a custom inference strategy.\r\n    pub fn register_strategy(\u0026mut self, _strategy: Box\u003cdyn InferenceStrategy\u003e) {\r\n        // Stub for extensibility.\r\n    }\r\n}\r\n\r\n// --- Traits for integration points (stubs) ---\r\n\r\n/// Core Evaluator trait.\r\npub trait CoreEvaluator {\r\n    fn evaluate(\u0026self, plan: Plan) -\u003e InferenceResult;\r\n}\r\n\r\n/// Memory Manager trait.\r\npub trait MemoryManager {}\r\n\r\n/// Goal System trait.\r\npub trait GoalSystem {\r\n    fn plan(\u0026self, goal: \u0026Goal) -\u003e Plan;\r\n}\r\n\r\n/// Type System trait.\r\npub trait TypeSystem {}\r\n\r\n/// Event System trait.\r\npub trait EventSystem {}\r\n\r\n/// Message Queue trait.\r\npub trait MessageQueue {}\r\n\r\n/// Error Handler trait.\r\npub trait ErrorHandler {}\r\n\r\n/// Secure Distributed Code Support trait.\r\npub trait SecureDistributedCodeSupport {}\r\n\r\n/// Inference Strategy trait for extensibility.\r\npub trait InferenceStrategy {\r\n    fn infer(\u0026self, engine: \u0026InferencingEngine, goal: \u0026Goal) -\u003e InferenceResult;\r\n}\r\n\r\n// --- Data structures (stubs) ---\r\n\r\n#[derive(Debug, PartialEq, Eq)]\r\npub enum Term {\r\n    Int(i64),\r\n    // Add other variants as needed\r\n}\r\n\r\npub struct Goal; // Placeholder for goal representation.\r\n\r\nimpl Default for Goal {\r\n    fn default() -\u003e Self {\r\n        Goal {}\r\n    }\r\n}\r\npub struct Plan; // Placeholder for plan representation.\r\n\r\npub struct InferenceResult {\r\n    pub success: bool,\r\n    pub message: Option\u003cString\u003e,\r\n}\r\n\r\nimpl InferenceResult {\r\n    pub fn error(msg: \u0026str) -\u003e Self {\r\n        Self { success: false, message: Some(msg.to_string()) }\r\n    }\r\n}\r\n\r\npub struct UnificationResult {\r\n    pub unified: bool,\r\n}\r\n\r\nimpl UnificationResult {\r\n    pub fn success() -\u003e Self { Self { unified: true } }\r\n    pub fn failure() -\u003e Self { Self { unified: false } }\r\n    pub fn is_success(\u0026self) -\u003e bool {\r\n        self.unified\r\n    }\r\n    pub fn is_failure(\u0026self) -\u003e bool {\r\n        !self.unified\r\n    }\r\n}\r\n\r\npub struct DistributedReasoningResult;\r\n\r\nimpl DistributedReasoningResult {\r\n    pub fn not_implemented() -\u003e Self { Self }\r\n\r\n    pub fn is_not_implemented(\u0026self) -\u003e bool {\r\n        true\r\n    }\r\n}","traces":[],"covered":0,"coverable":0},{"path":["E:","\\","patlang","rust-runtime","src","lexer.rs"],"content":"//! Patlang Lexer for Rust parser\r\n\r\n#[derive(Debug, Clone, PartialEq)]\r\npub enum Token {\r\n    Number(f64),\r\n    String(String),\r\n    Identifier(String),\r\n    Plus,\r\n    Minus,\r\n    Star,\r\n    Slash,\r\n    Percent,\r\n    LParen,\r\n    RParen,\r\n    Comma,\r\n    Let,\r\n    Fn,\r\n    Return,\r\n    Equal,\r\n    EqualEqual,\r\n    Greater,\r\n    GreaterEqual,\r\n    Less,\r\n    LessEqual,\r\n    Newline,\r\n    EOF,\r\n    // Patlang-specific tokens\r\n    Goal,\r\n    Rule,\r\n    BlockStart, // e.g. '{'\r\n    BlockEnd,   // e.g. '}'\r\n    // Extend with more tokens as needed\r\n}\r\n\r\n#[derive(Debug)]\r\npub struct Lexer\u003c'a\u003e {\r\n    input: \u0026'a str,\r\n    position: usize,\r\n    // Add more fields as needed\r\n}\r\n\r\n#[derive(Debug)]\r\npub enum LexerError {\r\n    UnexpectedCharacter(char, usize),\r\n    UnterminatedString(usize),\r\n    // Extend with more error types as needed\r\n}\r\n\r\nimpl\u003c'a\u003e Lexer\u003c'a\u003e {\r\n    pub fn new(input: \u0026'a str) -\u003e Self {\r\n        println!(\"[DEBUG] Lexer::new called with input:\\n{}\", input);\r\n        Lexer { input, position: 0 }\r\n    }\r\n\r\n    pub fn next_token(\u0026mut self) -\u003e Result\u003cToken, LexerError\u003e {\r\n        let bytes = self.input.as_bytes();\r\n        let len = bytes.len();\r\n        while self.position \u003c len {\r\n            let c = bytes[self.position] as char;\r\n            println!(\"[DEBUG][lexer] At position {}: char {:?}\", self.position, c);\r\n            // Newline as statement separator\r\n            if c == '\\n' {\r\n                self.position += 1;\r\n                println!(\"[DEBUG][lexer] Returning Token::Newline\");\r\n                return Ok(Token::Newline);\r\n            }\r\n            // Skip whitespace (except newline)\r\n            if c.is_whitespace() \u0026\u0026 c != '\\n' {\r\n                self.position += 1;\r\n                continue;\r\n            }\r\n            // Skip comments\r\n            if c == '#' {\r\n                while self.position \u003c len \u0026\u0026 bytes[self.position] as char != '\\n' {\r\n                    self.position += 1;\r\n                }\r\n                continue;\r\n            }\r\n            // Numbers (integer only for now)\r\n            if c.is_ascii_digit() {\r\n                let start = self.position;\r\n                while self.position \u003c len \u0026\u0026 (bytes[self.position] as char).is_ascii_digit() {\r\n                    self.position += 1;\r\n                }\r\n                let num_str = \u0026self.input[start..self.position];\r\n                let num = num_str.parse::\u003cf64\u003e().unwrap_or(0.0);\r\n                println!(\"[DEBUG][lexer] Returning Token::Number({})\", num);\r\n                return Ok(Token::Number(num));\r\n            }\r\n            // Identifiers and keywords\r\n            if c.is_ascii_alphabetic() || c == '_' {\r\n                let start = self.position;\r\n                self.position += 1;\r\n                while self.position \u003c len {\r\n                    let nc = bytes[self.position] as char;\r\n                    if nc.is_ascii_alphanumeric() || nc == '_' {\r\n                        self.position += 1;\r\n                    } else {\r\n                        break;\r\n                    }\r\n                }\r\n                let ident = \u0026self.input[start..self.position];\r\n                println!(\"[DEBUG][lexer] Returning Token::Identifier({})\", ident);\r\n                return Ok(match ident {\r\n                    \"let\" =\u003e Token::Let,\r\n                    \"fn\" =\u003e Token::Fn,\r\n                    \"return\" =\u003e Token::Return,\r\n                    \"goal\" =\u003e Token::Goal,\r\n                    \"rule\" =\u003e Token::Rule,\r\n                    \"true\" | \"false\" =\u003e Token::Identifier(ident.to_string()), // treat as identifier for now\r\n                    \"not\" | \"and\" | \"or\" | \"print\" =\u003e Token::Identifier(ident.to_string()),\r\n                    _ =\u003e Token::Identifier(ident.to_string()),\r\n                });\r\n            }\r\n            // Block delimiters (for future use, e.g. '{' and '}')\r\n            if c == '{' {\r\n                self.position += 1;\r\n                return Ok(Token::BlockStart);\r\n            }\r\n            if c == '}' {\r\n                self.position += 1;\r\n                return Ok(Token::BlockEnd);\r\n            }\r\n            // String literals\r\n            if c == '\"' {\r\n                self.position += 1;\r\n                let start = self.position;\r\n                while self.position \u003c len \u0026\u0026 bytes[self.position] as char != '\"' {\r\n                    // Handle escape sequences later\r\n                    self.position += 1;\r\n                }\r\n                let s = \u0026self.input[start..self.position];\r\n                if self.position \u003c len \u0026\u0026 bytes[self.position] as char == '\"' {\r\n                    self.position += 1;\r\n                    println!(\"[DEBUG][lexer] Returning Token::String({})\", s);\r\n                    return Ok(Token::String(s.to_string()));\r\n                } else {\r\n                    return Err(LexerError::UnterminatedString(self.position));\r\n                }\r\n            }\r\n            // Operators and parens\r\n            self.position += 1;\r\n            let token = match c {\r\n                '+' =\u003e Token::Plus,\r\n                '-' =\u003e Token::Minus,\r\n                '*' =\u003e Token::Star,\r\n                '/' =\u003e Token::Slash,\r\n                '%' =\u003e Token::Percent,\r\n                '(' =\u003e Token::LParen,\r\n
