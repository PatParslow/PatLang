<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatLang Spreadsheet - Standalone WASM Grid</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- SheetJS for client-side XLSX import/export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Marked for markdown preview rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">P</div>
      <div>
        <h1>PatLang Spreadsheet</h1>
        <p style="font-size: 0.75rem; color: var(--text-muted);">Standalone WebAssembly Engine</p>
      </div>
    </div>
    
    <div class="toolbar">
      <button class="btn" id="btn-import-markdown">
        Import MD Table
      </button>
      <button class="btn" id="btn-export-markdown">
        Export MD File
      </button>
      
      <div class="file-input-wrapper">
        <button class="btn" onclick="document.getElementById('file-import-xlsx').click()">Import XLSX</button>
        <input type="file" id="file-import-xlsx" accept=".xlsx" style="display: none;" />
      </div>
      
      <button class="btn btn-primary" id="btn-export-xlsx">
        Export XLSX
      </button>
    </div>
  </header>

  <div class="formula-bar-container">
    <div class="cell-address-indicator" id="active-cell-address">A1</div>
    <div class="formula-label">fx</div>
    <input type="text" class="formula-input" id="formula-input" placeholder="Enter formula (e.g. =A1+B1) or text">
  </div>

  <main class="main-content">
    <div class="grid-viewport">
      <div class="spreadsheet-grid" id="grid">
        <!-- Cells generated dynamically by app.js -->
      </div>
    </div>
    
    <aside class="side-panel">
      <h2 class="panel-title">Markdown Preview</h2>
      <div class="markdown-preview" id="preview-content">
        <p style="color: var(--text-muted); font-style: italic;">Markdown table preview will show up here...</p>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
