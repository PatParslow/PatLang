# PatLang Standard Library Manifest
# Describes all stdlib modules, their foreign functions, and dependencies.
# Pure Object Model: everything is an object; primitives are classes with methods.

stdlib_version: "0.2.0"
patlang_version: ">=0.2.0"

# Class hierarchy (pure object model)
class_hierarchy:
  BaseObject: null
  ClassType:
    - name
    - superclass
    - new
  BooleanType:
    - equals
    - not_op
    - and_op
    - or_op
    - xor
    - if_true
    - if_false
    - to_string
    - true_value
    - false_value
  NilType:
    - equals
    - to_string
    - is_nil
    - default_to
    - nil_value
  BaseNumber:
    - equals
    - less_than
    - greater_than
    - less_equal
    - greater_equal
    - add
    - subtract
    - multiply
    - divide
    - modulo
    - power
    - abs
    - negate
    - to_integer
    - to_float
    - to_string
  Integer:
    - bitwise_and
    - bitwise_or
    - bitwise_xor
    - bitwise_not
    - shift_left
    - shift_right
    - is_even
    - is_odd
    - factorial
    - gcd
    - lcm
    - to_string
  Float:
    - sqrt
    - floor
    - ceil
    - round
    - sin
    - cos
    - tan
    - log
    - exp
    - to_string
  String:
    - length
    - is_empty
    - equals
    - concat
    - substring
    - char_at
    - split
    - join
    - uppercase
    - lowercase
    - trim
    - starts_with
    - ends_with
    - contains
    - index_of
    - replace
    - matches
  BaseList:
    - length
    - is_empty
    - get
    - set
    - first
    - last
    - append
    - prepend
    - concat
    - insert
    - remove_at
    - pop
    - reverse
    - map
    - filter
    - reduce
    - reduce1
    - find
    - find_index
    - any
    - all
    - none
    - count
    - sort
    - sort_by
    - slice
    - take
    - drop
    - flatten
    - uniq
    - zip
    - group_by
    - partition
    - chunk
    - join
    - each
    - to_string
  ObjectDict:
    - length
    - is_empty
    - get
    - set
    - has_key
    - remove
    - keys
    - values
    - merge
    - each
    - map_values
    - filter_keys
    - to_string
  BaseFunction:
    - call
    - arity
    - parameters
    - curry
    - compose
    - to_string
  BaseChannel:
    - send
    - receive_op
    - try_receive
    - close
    - is_closed
    - size
  BaseMutex:
    - lock_op
    - unlock_op
    - try_lock
    - synchronize
  ActorType:
    - send
    - state
    - stop
    - is_running
  Future:
    - await_op
    - is_ready
    - value
    - then_op
    - catch_op
  SelectCase:
    - channel_of
    - pattern
    - body
  BaseSelect:
    - add_case
    - execute
  Exception:
    - message
    - stack_trace
    - raise_op

# Global constructors (in Core module)
global_constructors:
  - nil_op
  - true_op
  - false_op
  - integer
  - integer_from_string
  - float
  - float_from_string
  - string
  - list_op
  - list_of
  - range_op
  - object
  - channel_op
  - mutex_op
  - actor_op
  - async_op
  - await_op
  - select_op
  - goal_system
  - print
  - println
  - error_op
  - core

modules:
  core:
    description: "Fundamental built-in classes available in all configurations"
    file: "core.pat"
    foreign_methods:
      # BaseObject
      - class: "BaseObject"
        methods:
          - name: "equals"
            signature: "(other: Object) -> BooleanType"
          - name: "to_string"
            signature: "() -> String"
          - name: "class_of"
            signature: "() -> ClassType"
          - name: "identity"
            signature: "() -> Object"
      # ClassType
      - class: "ClassType"
        methods:
          - name: "name"
            signature: "() -> String"
          - name: "superclass"
            signature: "() -> ClassType?"
          - name: "new"
            signature: "(args: BaseList) -> Object"
      # BooleanType
      - class: "BooleanType"
        methods:
          - name: "equals"
            signature: "(other: Object) -> BooleanType"
          - name: "not_op"
            signature: "() -> BooleanType"
          - name: "and_op"
            signature: "(other: BooleanType) -> BooleanType"
          - name: "or_op"
            signature: "(other: BooleanType) -> BooleanType"
          - name: "xor"
            signature: "(other: BooleanType) -> BooleanType"
          - name: "if_true"
            signature: "(then_block: BaseFunction, else_block: BaseFunction) -> Object"
          - name: "if_false"
            signature: "(then_block: BaseFunction, else_block: BaseFunction) -> Object"
          - name: "to_string"
            signature: "() -> String"
          - name: "true_value"
            signature: "() -> BooleanType"
          - name: "false_value"
            signature: "() -> BooleanType"
      # NilType
      - class: "NilType"
        methods:
          - name: "equals"
            signature: "(other: Object) -> BooleanType"
          - name: "to_string"
            signature: "() -> String"
          - name: "is_nil"
            signature: "() -> BooleanType"
          - name: "default_to"
            signature: "(value: Object) -> Object"
          - name: "nil_value"
            signature: "() -> NilType"
      # BaseNumber
      - class: "BaseNumber"
        methods:
          - name: "equals"
            signature: "(other: Object) -> BooleanType"
          - name: "less_than"
            signature: "(other: BaseNumber) -> BooleanType"
          - name: "greater_than"
            signature: "(other: BaseNumber) -> BooleanType"
          - name: "less_equal"
            signature: "(other: BaseNumber) -> BooleanType"
          - name: "greater_equal"
            signature: "(other: BaseNumber) -> BooleanType"
          - name: "add"
            signature: "(other: BaseNumber) -> BaseNumber"
          - name: "subtract"
            signature: "(other: BaseNumber) -> BaseNumber"
          - name: "multiply"
            signature: "(other: BaseNumber) -> BaseNumber"
          - name: "divide"
            signature: "(other: BaseNumber) -> BaseNumber"
          - name: "modulo"
            signature: "(other: BaseNumber) -> BaseNumber"
          - name: "power"
            signature: "(other: BaseNumber) -> BaseNumber"
          - name: "abs"
            signature: "() -> BaseNumber"
          - name: "negate"
            signature: "() -> BaseNumber"
          - name: "to_integer"
            signature: "() -> Integer"
          - name: "to_float"
            signature: "() -> Float"
          - name: "to_string"
            signature: "() -> String"
      # Integer
      - class: "Integer"
        methods:
          - name: "bitwise_and"
            signature: "(other: Integer) -> Integer"
          - name: "bitwise_or"
            signature: "(other: Integer) -> Integer"
          - name: "bitwise_xor"
            signature: "(other: Integer) -> Integer"
          - name: "bitwise_not"
            signature: "() -> Integer"
          - name: "shift_left"
            signature: "(bits: Integer) -> Integer"
          - name: "shift_right"
            signature: "(bits: Integer) -> Integer"
          - name: "is_even"
            signature: "() -> BooleanType"
          - name: "is_odd"
            signature: "() -> BooleanType"
          - name: "factorial"
            signature: "() -> Integer"
          - name: "gcd"
            signature: "(other: Integer) -> Integer"
          - name: "lcm"
            signature: "(other: Integer) -> Integer"
          - name: "to_string"
            signature: "(base?: Integer) -> String"
      # Float
      - class: "Float"
        methods:
          - name: "sqrt"
            signature: "() -> Float"
          - name: "floor"
            signature: "() -> Integer"
          - name: "ceil"
            signature: "() -> Integer"
          - name: "round"
            signature: "() -> Integer"
          - name: "sin"
            signature: "() -> Float"
          - name: "cos"
            signature: "() -> Float"
          - name: "tan"
            signature: "() -> Float"
          - name: "log"
            signature: "(base?: Float) -> Float"
          - name: "exp"
            signature: "() -> Float"
          - name: "to_string"
            signature: "(precision?: Integer) -> String"
      # String
      - class: "String"
        methods:
          - name: "length"
            signature: "() -> Integer"
          - name: "is_empty"
            signature: "() -> BooleanType"
          - name: "equals"
            signature: "(other: Object) -> BooleanType"
          - name: "concat"
            signature: "(other: String) -> String"
          - name: "substring"
            signature: "(start: Integer, length: Integer) -> String"
          - name: "char_at"
            signature: "(index: Integer) -> String"
          - name: "split"
            signature: "(delimiter: String) -> BaseList"
          - name: "join"
            signature: "(items: BaseList) -> String"
          - name: "uppercase"
            signature: "() -> String"
          - name: "lowercase"
            signature: "() -> String"
          - name: "trim"
            signature: "() -> String"
          - name: "starts_with"
            signature: "(prefix: String) -> BooleanType"
          - name: "ends_with"
            signature: "(suffix: String) -> BooleanType"
          - name: "contains"
            signature: "(substr: String) -> BooleanType"
          - name: "index_of"
            signature: "(substr: String) -> Integer"
          - name: "replace"
            signature: "(old: String, new: String) -> String"
          - name: "matches"
            signature: "(pattern: String) -> BooleanType"
      # BaseList
      - class: "BaseList"
        methods:
          - name: "length"
            signature: "() -> Integer"
          - name: "is_empty"
            signature: "() -> BooleanType"
          - name: "get"
            signature: "(index: Integer) -> Object"
          - name: "set"
            signature: "(index: Integer, value: Object) -> BaseList"
          - name: "first"
            signature: "() -> Object"
          - name: "last"
            signature: "() -> Object"
          - name: "append"
            signature: "(value: Object) -> BaseList"
          - name: "prepend"
            signature: "(value: Object) -> BaseList"
          - name: "concat"
            signature: "(other: BaseList) -> BaseList"
          - name: "insert"
            signature: "(index: Integer, value: Object) -> BaseList"
          - name: "remove_at"
            signature: "(index: Integer) -> BaseList"
          - name: "pop"
            signature: "() -> Object"
          - name: "reverse"
            signature: "() -> BaseList"
          - name: "map"
            signature: "(fn: BaseFunction) -> BaseList"
          - name: "filter"
            signature: "(pred: BaseFunction) -> BaseList"
          - name: "reduce"
            signature: "(init: Object, fn: BaseFunction) -> Object"
          - name: "reduce1"
            signature: "(fn: BaseFunction) -> Object"
          - name: "find"
            signature: "(pred: BaseFunction) -> Object"
          - name: "find_index"
            signature: "(pred: BaseFunction) -> Integer"
          - name: "any"
            signature: "(pred: BaseFunction) -> BooleanType"
          - name: "all"
            signature: "(pred: BaseFunction) -> BooleanType"
          - name: "none"
            signature: "(pred: BaseFunction) -> BooleanType"
          - name: "count"
            signature: "(pred_or_val: Object) -> Integer"
          - name: "sort"
            signature: "() -> BaseList"
          - name: "sort_by"
            signature: "(key_fn: BaseFunction) -> BaseList"
          - name: "slice"
            signature: "(start: Integer, finish: Integer) -> BaseList"
          - name: "take"
            signature: "(n: Integer) -> BaseList"
          - name: "drop"
            signature: "(n: Integer) -> BaseList"
          - name: "flatten"
            signature: "() -> BaseList"
          - name: "uniq"
            signature: "() -> BaseList"
          - name: "zip"
            signature: "(lists: BaseList) -> BaseList"
          - name: "group_by"
            signature: "(key_fn: BaseFunction) -> ObjectDict"
          - name: "partition"
            signature: "(pred: BaseFunction) -> ObjectDict"
          - name: "chunk"
            signature: "(size: Integer) -> BaseList"
          - name: "join"
            signature: "(delimiter: String) -> String"
          - name: "each"
            signature: "(fn: BaseFunction) -> NilType"
          - name: "to_string"
            signature: "() -> String"
      # ObjectDict
      - class: "ObjectDict"
        methods:
          - name: "length"
            signature: "() -> Integer"
          - name: "is_empty"
            signature: "() -> BooleanType"
          - name: "get"
            signature: "(key: String) -> Object"
          - name: "set"
            signature: "(key: String, value: Object) -> ObjectDict"
          - name: "has_key"
            signature: "(key: String) -> BooleanType"
          - name: "remove"
            signature: "(key: String) -> ObjectDict"
          - name: "keys"
            signature: "() -> BaseList"
          - name: "values"
            signature: "() -> BaseList"
          - name: "merge"
            signature: "(other: ObjectDict) -> ObjectDict"
          - name: "each"
            signature: "(fn: BaseFunction) -> NilType"
          - name: "map_values"
            signature: "(fn: BaseFunction) -> ObjectDict"
          - name: "filter_keys"
            signature: "(pred: BaseFunction) -> ObjectDict"
          - name: "to_string"
            signature: "() -> String"
      # BaseFunction
      - class: "BaseFunction"
        methods:
          - name: "call"
            signature: "(args: BaseList) -> Object"
          - name: "arity"
            signature: "() -> Integer"
          - name: "parameters"
            signature: "() -> BaseList"
          - name: "curry"
            signature: "(args: BaseList) -> BaseFunction"
          - name: "compose"
            signature: "(other: BaseFunction) -> BaseFunction"
          - name: "to_string"
            signature: "() -> String"
      # BaseChannel
      - class: "BaseChannel"
        methods:
          - name: "send"
            signature: "(value: Object) -> Object"
          - name: "receive_op"
            signature: "() -> Object"
          - name: "try_receive"
            signature: "() -> Object?"
          - name: "close"
            signature: "() -> NilType"
          - name: "is_closed"
            signature: "() -> BooleanType"
          - name: "size"
            signature: "() -> Integer"
      # BaseMutex
      - class: "BaseMutex"
        methods:
          - name: "lock_op"
            signature: "() -> NilType"
          - name: "unlock_op"
            signature: "() -> NilType"
          - name: "try_lock"
            signature: "() -> BooleanType"
          - name: "synchronize"
            signature: "(block: BaseFunction) -> Object"
      # ActorType
      - class: "ActorType"
        methods:
          - name: "send"
            signature: "(message: Object) -> NilType"
          - name: "state"
            signature: "() -> Object"
          - name: "stop"
            signature: "() -> NilType"
          - name: "is_running"
            signature: "() -> BooleanType"
      # Future
      - class: "Future"
        methods:
          - name: "await_op"
            signature: "() -> Object"
          - name: "is_ready"
            signature: "() -> BooleanType"
          - name: "value"
            signature: "() -> Object"
          - name: "then_op"
            signature: "(fn: BaseFunction) -> Future"
          - name: "catch_op"
            signature: "(fn: BaseFunction) -> Future"
      # SelectCase
      - class: "SelectCase"
        methods:
          - name: "channel_of"
            signature: "() -> BaseChannel"
          - name: "pattern"
            signature: "() -> Object"
          - name: "body"
            signature: "() -> BaseFunction"
      # BaseSelect
      - class: "BaseSelect"
        methods:
          - name: "add_case"
            signature: "(ch: BaseChannel, pattern: Object, body: BaseFunction) -> BaseSelect"
          - name: "execute"
            signature: "() -> Object"
      # Exception
      - class: "Exception"
        methods:
          - name: "message"
            signature: "() -> String"
          - name: "stack_trace"
            signature: "() -> String"
          - name: "raise_op"
            signature: "() -> never"
      # Global constructors (Core module)
      - module: "Core"
        methods:
          - name: "nil_op"
            signature: "() -> NilType"
          - name: "true_op"
            signature: "() -> BooleanType"
          - name: "false_op"
            signature: "() -> BooleanType"
          - name: "integer"
            signature: "(value: Object) -> Integer"
          - name: "integer_from_string"
            signature: "(s: String, base?: Integer) -> Integer"
          - name: "float"
            signature: "(value: Object) -> Float"
          - name: "float_from_string"
            signature: "(s: String) -> Float"
          - name: "string"
            signature: "(value: Object) -> String"
          - name: "list_op"
            signature: "(items: BaseList) -> BaseList"
          - name: "list_of"
            signature: "(count: Integer, fn: BaseFunction) -> BaseList"
          - name: "range_op"
            signature: "(start: Integer, finish: Integer, step?: Integer) -> BaseList"
          - name: "object"
            signature: "(pairs: BaseList) -> ObjectDict"
          - name: "channel_op"
            signature: "(size?: Integer) -> BaseChannel"
          - name: "mutex_op"
            signature: "() -> BaseMutex"
          - name: "actor_op"
            signature: "(behavior: BaseFunction, initial_state: Object) -> ActorType"
          - name: "async_op"
            signature: "(fn: BaseFunction) -> Future"
          - name: "await_op"
            signature: "(future: Future) -> Object"
          - name: "select_op"
            signature: "(cases: BaseList) -> Object"
          - name: "goal_system"
            signature: "() -> Object"
          - name: "print"
            signature: "(value: Object) -> NilType"
          - name: "println"
            signature: "(value: Object) -> NilType"
          - name: "error_op"
            signature: "(message: String) -> never"
          - name: "core"
            signature: "() -> Core"

  collections:
    description: "Collection manipulation functions (map, filter, reduce, etc.)"
    file: "collections.pat"
    dependencies: ["core"]
    foreign_functions: []

  logic:
    description: "Logic programming functions"
    file: "logic.pat"
    dependencies: ["core"]
    foreign_functions:
      - name: "logic_assert"
        signature: "(pred: String, args: BaseList) -> BooleanType"
      - name: "logic_retract"
        signature: "(pred: String, args: BaseList) -> NilType"
      - name: "logic_query"
        signature: "(query_str: String) -> BaseList"
      - name: "logic_rule"
        signature: "(head: String, body: BaseList) -> String"
      - name: "logic_all_facts"
        signature: "() -> BaseList"
      - name: "logic_fact_count"
        signature: "() -> Integer"
      - name: "logic_unify"
        signature: "(term1: Object, term2: Object) -> ObjectDict?"
      - name: "logic_var"
        signature: "(name: String) -> Object"
      - name: "logic_term"
        signature: "(functor: String, args: BaseList) -> Object"

  goals:
    description: "Goal-oriented programming functions"
    file: "goals.pat"
    dependencies: ["core", "logic"]
    foreign_functions:
      - name: "goal_system_get"
        signature: "() -> Object"
      - name: "declare_goal"
        signature: "(name: String, defn: String) -> Object"
      - name: "pursue"
        signature: "(goal_name: String) -> Object"
      - name: "pursue_with"
        signature: "(goal_name: String, ctx: ObjectDict) -> Object"
      - name: "pursue_all"
        signature: "(goal_names: BaseList, ctx: ObjectDict) -> Object"
      - name: "execution_plan"
        signature: "(goal_name: String) -> Object"
      - name: "monitor_goal"
        signature: "(goal_name: String) -> Object"
      - name: "get_goal"
        signature: "(name: String) -> Object"
      - name: "all_goals"
        signature: "() -> BaseList"
      - name: "resource_scheduler"
        signature: "() -> Object"

  io:
    description: "Input/output functions"
    file: "io.pat"
    dependencies: ["core"]
    foreign_functions:
      - name: "io_print_raw"
        signature: "(val: String) -> Object"
      - name: "io_println_raw"
        signature: "(val: String) -> Object"
      - name: "format"
        signature: "(fmt_str: String, args: BaseList) -> String"
      - name: "read_line"
        signature: "() -> String?"
      - name: "read_all"
        signature: "() -> String"
      - name: "file_read"
        signature: "(path: String) -> String"
      - name: "file_write"
        signature: "(path: String, content: String) -> BooleanType"
      - name: "file_append"
        signature: "(path: String, content: String) -> BooleanType"
      - name: "file_exists"
        signature: "(path: String) -> BooleanType"
      - name: "file_delete"
        signature: "(path: String) -> BooleanType"
      - name: "file_read_lines"
        signature: "(path: String) -> BaseList"
      - name: "file_write_lines"
        signature: "(path: String, lines: BaseList) -> BooleanType"
      - name: "dir_exists"
        signature: "(path: String) -> BooleanType"
      - name: "dir_create"
        signature: "(path: String) -> BooleanType"
      - name: "dir_list"
        signature: "(path: String) -> BaseList"
      - name: "json_parse"
        signature: "(json_str: String) -> Object"
      - name: "json_stringify"
        signature: "(val: Object) -> String"
      - name: "yaml_parse"
        signature: "(yaml_str: String) -> Object"
      - name: "yaml_stringify"
        signature: "(val: Object) -> String"
      - name: "file_size"
        signature: "(path: String) -> Integer"
      - name: "file_modified"
        signature: "(path: String) -> Integer"
      - name: "temp_file"
        signature: "(prefix: String) -> String"
      - name: "temp_dir"
        signature: "(prefix: String) -> String"
      - name: "env_get"
        signature: "(key: String) -> String?"
      - name: "env_set"
        signature: "(key: String, val: String) -> BooleanType"
      - name: "env_has"
        signature: "(key: String) -> BooleanType"
      - name: "execute"
        signature: "(cmd: String) -> String"
      - name: "execute_with_args"
        signature: "(cmd: String, args: BaseList) -> String"
      - name: "last_exit_code"
        signature: "() -> Integer"

  html_gui:
    description: "HTML/JS GUI rendering functions"
    file: "html_gui.pat"
    dependencies: ["core", "collections"]
    foreign_functions:
      - name: "js_eval"
        signature: "(js: String) -> Object"
      - name: "js_function"
        signature: "(name: String, body: String) -> String"
      - name: "js_event_handler"
        signature: "(elem_id: String, event: String, handler: String) -> String"
      - name: "dom_get_by_id"
        signature: "(id: String) -> Object"
      - name: "dom_query_selector"
        signature: "(selector: String) -> Object"
      - name: "dom_query_selector_all"
        signature: "(selector: String) -> BaseList"
      - name: "dom_set_attribute"
        signature: "(elem_id: String, attr: String, val: String) -> String"
      - name: "dom_get_attribute"
        signature: "(elem_id: String, attr: String) -> String"
      - name: "dom_set_inner_html"
        signature: "(elem_id: String, html: String) -> String"
      - name: "dom_append_child"
        signature: "(parent_id: String, child: Object) -> String"
      - name: "dom_remove_child"
        signature: "(parent_id: String, child: Object) -> String"
      - name: "dom_create_element"
        signature: "(tag: String) -> Object"
      - name: "dom_create_text_node"
        signature: "(txt: String) -> Object"
      - name: "dom_set_style"
        signature: "(elem_id: String, prop: String, val: String) -> String"
      - name: "dom_get_style"
        signature: "(elem_id: String, prop: String) -> String"
      - name: "dom_add_class"
        signature: "(elem_id: String, cls: String) -> String"
      - name: "dom_remove_class"
        signature: "(elem_id: String, cls: String) -> String"
      - name: "dom_toggle_class"
        signature: "(elem_id: String, cls: String) -> String"
      - name: "on_click"
        signature: "(elem_id: String, handler: String) -> String"
      - name: "on_change"
        signature: "(elem_id: String, handler: String) -> String"
      - name: "on_submit"
        signature: "(elem_id: String, handler: String) -> String"
      - name: "on_input"
        signature: "(elem_id: String, handler: String) -> String"
      - name: "on_keydown"
        signature: "(elem_id: String, handler: String) -> String"
      - name: "on_keyup"
        signature: "(elem_id: String, handler: String) -> String"
      - name: "on_mouseover"
        signature: "(elem_id: String, handler: String) -> String"
      - name: "on_mouseout"
        signature: "(elem_id: String, handler: String) -> String"
      - name: "canvas_create"
        signature: "(w: Integer, h: Integer) -> Object"
      - name: "canvas_get_context"
        signature: "(canvas: Object) -> Object"
      - name: "canvas_draw_rect"
        signature: "(ctx: Object, x: Integer, y: Integer, w: Integer, h: Integer) -> String"
      - name: "canvas_draw_circle"
        signature: "(ctx: Object, x: Integer, y: Integer, r: Integer) -> String"
      - name: "canvas_set_fill_style"
        signature: "(ctx: Object, color: String) -> String"
      - name: "canvas_set_stroke_style"
        signature: "(ctx: Object, color: String) -> String"
      - name: "canvas_draw_line"
        signature: "(ctx: Object, x1: Integer, y1: Integer, x2: Integer, y2: Integer) -> String"
      - name: "render_to_file"
        signature: "(filename: String, content: String) -> String"
      - name: "html_to_string"
        signature: "(html: Object) -> String"
