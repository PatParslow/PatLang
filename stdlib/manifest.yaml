        signature: "(txt: String) -> String"

  http:
    description: "HTTP client and server functionality"
    file: "http.pat"
    dependencies: ["core", "io"]
    foreign_methods:
      # HttpServer
      - class: "HttpServer"
        methods:
          - name: "initialize"
            signature: "(port: Integer, handler: BaseFunction) -> HttpServer"
          - name: "start"
            signature: "() -> NilType"
          - name: "stop"
            signature: "() -> NilType"
          - name: "is_running"
            signature: "() -> BooleanType"
          - name: "port"
            signature: "() -> Integer"
      # HttpRequest
      - class: "HttpRequest"
        methods:
          - name: "method"
            signature: "() -> String"
          - name: "path"
            signature: "() -> String"
          - name: "headers"
            signature: "() -> ObjectDict"
          - name: "body"
            signature: "() -> String"
          - name: "query_params"
            signature: "() -> ObjectDict"
          - name: "url"
            signature: "() -> String"
      # HttpResponse
      - class: "HttpResponse"
        methods:
          - name: "initialize"
            signature: "(status: Integer, headers?: ObjectDict, body?: String) -> HttpResponse"
          - name: "status"
            signature: "() -> Integer"
          - name: "headers"
            signature: "() -> ObjectDict"
          - name: "body"
            signature: "() -> String"
          - name: "set_header"
            signature: "(name: String, value: String) -> NilType"
          - name: "write"
            signature: "(data: String) -> NilType"
          - name: "to_string"
            signature: "() -> String"
      # TcpListener
      - class: "TcpListener"
        methods:
          - name: "initialize"
            signature: "(port: Integer) -> TcpListener"
          - name: "accept"
            signature: "() -> TcpStream?"
          - name: "close"
            signature: "() -> NilType"
          - name: "port"
            signature: "() -> Integer"
      # TcpStream
      - class: "TcpStream"
        methods:
          - name: "read"
            signature: "(size: Integer) -> String"
          - name: "write"
            signature: "(data: String) -> Integer"
          - name: "flush"
            signature: "() -> NilType"
          - name: "close"
            signature: "() -> NilType"
          - name: "peer_address"
            signature: "() -> String"
      # HttpClient
      - class: "HttpClient"
        methods:
          - name: "get"
            signature: "(url: String, headers?: ObjectDict) -> HttpResponse"
          - name: "post"
            signature: "(url: String, body?: String, headers?: ObjectDict) -> HttpResponse"
          - name: "put"
            signature: "(url: String, body?: String, headers?: ObjectDict) -> HttpResponse"
          - name: "delete"
            signature: "(url: String, headers?: ObjectDict) -> HttpResponse"
          - name: "request"
            signature: "(method: String, url: String, body?: String, headers?: ObjectDict) -> HttpResponse"
      # HttpRouter
      - class: "HttpRouter"
        methods:
          - name: "initialize"
            signature: "() -> HttpRouter"
          - name: "get"
            signature: "(path: String, handler: BaseFunction) -> NilType"
          - name: "post"
            signature: "(path: String, handler: BaseFunction) -> NilType"
          - name: "put"
            signature: "(path: String, handler: BaseFunction) -> NilType"
          - name: "delete"
            signature: "(path: String, handler: BaseFunction) -> NilType"
          - name: "handle"
            signature: "(request: HttpRequest) -> HttpResponse"
      # Http (global constructors)
      - module: "Http"
        methods:
          - name: "server"
            signature: "(port: Integer, handler: BaseFunction) -> HttpServer"
          - name: "client"
            signature: "() -> HttpClient"
          - name: "router"
            signature: "() -> HttpRouter"

# C Runtime Requirements
c_runtime:
  types:
    - name: "PatlangObject"
      description: "Unified object header with type tag, refcount, and payload"
    - name: "PatlangInteger"
      description: "Small integer (NaN-boxed or tagged pointer)"
    - name: "PatlangFloat"
      description: "IEEE 754 double-precision float"
    - name: "PatlangString"
      description: "UTF-8 string with length, refcount"
    - name: "PatlangList"
      description: "Dynamic array of PatlangObject"
    - name: "PatlangDict"
      description: "Hash map string -> PatlangObject"
    - name: "PatlangFunction"
      description: "Closure with captured environment + code pointer"
    - name: "PatlangChannel"
      description: "Thread-safe queue for CSP"
    - name: "PatlangMutex"
      description: "Recursive mutex"
    - name: "PatlangActor"
      description: "Actor with mailbox and behavior closure"
    - name: "PatlangFuture"
      description: "Async computation handle"
    - name: "PatlangClass"
      description: "Class object with method table, superclass pointer"
    - name: "PatlangException"
      description: "Exception object with message and stack trace"
  
  memory:
    gc:
      type: "incremental_mark_sweep"
      description: "Incremental mark-and-sweep garbage collector"
    object_header_size: 16
    small_integer_threshold: 63
  
  threads:
    model: "green_threads"
    scheduler: "work_stealing"
    description: "M:N green threads with work-stealing scheduler"
  
  dispatch:
    method_lookup: "inline_cache"
    description: "Polymorphic inline caching for method dispatch"
  
  ffi:
    enabled: true
    description: "Foreign function interface for C interop"